# Dependabot: stelt wekelijks updates voor van Python-pakketten, de base-image en GitHub Actions.
# Let op: de code op GitHub wordt bijgewerkt via commit-git.sh vanuit de werkmap. Neem updates daarom
# daar over (dan sluiten de pull requests vanzelf) in plaats van ze op GitHub samen te voegen.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    groups:
      python-pakketten:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      github-actions:
        patterns: ["*"]
