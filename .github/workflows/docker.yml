# Bouwt de image en zet hem op ghcr.io/<account>/nswhunter
#   push naar main      -> :latest  (+ :sha-xxxxxxx)
#   release vX.Y.Z      -> :X.Y.Z en :X.Y
# Platforms: linux/amd64 (NAS, server) en linux/arm64 (Apple Silicon, Raspberry Pi).
name: Docker image

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

# Alle acties staan vast op een exacte commit (met de versie erachter); Dependabot werkt ze bij.
permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/<account>/nswhunter

jobs:
  # Eerst de tests: mislukt er één, dan wordt er geen image gebouwd.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -W ignore::DeprecationWarning
      # Bekende lekken in de Python-pakketten? Dan stopt de build.
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --strict

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Controleer versienummer
        if: github.event_name == 'release'
        run: |
          app_version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' app/version.py)
          tag="${GITHUB_REF_NAME#v}"
          echo "app: $app_version  tag: $tag"
          if [ "$app_version" != "$tag" ]; then
            echo "::error::Release-tag v$tag komt niet overeen met __version__ $app_version"
            exit 1
          fi
          grep -q "^## \[$tag\]" CHANGELOG.md || { echo "::error::CHANGELOG.md mist een entry voor $tag"; exit 1; }

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,enable={{is_default_branch}}

      # Eerst lokaal bouwen en scannen; alleen een image zonder kritieke, oplosbare lekken wordt gepubliceerd.
      - name: Bouwen voor de scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: nswhunter-scan:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image scannen (Trivy)
        # vastgepind op de commit van v0.36.0: een tag kan later worden verplaatst, een commit-hash niet
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nswhunter-scan:latest
          severity: CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "1"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
