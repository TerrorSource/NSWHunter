# Builds the image and puts it on ghcr.io/<account>/<repository>
#   push to main        -> :latest  (+ :sha-xxxxxxx)
#   release vX.Y.Z      -> :X.Y.Z and :X.Y
# Platforms: linux/amd64 and linux/arm64 (Apple Silicon, Raspberry Pi).
name: Docker image

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

# Every action is pinned to an exact commit (with the version behind it); Dependabot updates them.
permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The tests first: if one fails, no image is built.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -W ignore::DeprecationWarning
      # Known vulnerabilities in the Python packages? Then the build stops.
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --strict

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check the version number
        if: github.event_name == 'release'
        run: |
          app_version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' app/version.py)
          tag="${GITHUB_REF_NAME#v}"
          echo "app: $app_version  tag: $tag"
          if [ "$app_version" != "$tag" ]; then
            echo "::error::Release tag v$tag does not match __version__ $app_version"
            exit 1
          fi
          grep -q "^## \[$tag\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no entry for $tag"; exit 1; }

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image is named after the repository this runs in; a registry wants lower case.
      - name: Name the image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,enable={{is_default_branch}}

      # Build and scan locally first; only an image without critical, fixable vulnerabilities is published.
      - name: Build for the scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: nswhunter-scan:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the image (Trivy)
        # pinned to the commit of v0.36.0: a tag can be moved later, a commit hash cannot
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nswhunter-scan:latest
          severity: CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "1"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
