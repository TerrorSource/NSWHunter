<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NSWHunter</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='4' fill='%23e4002b'/><path d='M4 8.5l2.5 2.5L12 5.5' stroke='white' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
  :root {
    --bg: #f5f5f3; --card: #ffffff; --line: #e2e1dc; --text: #1d1d1b; --soft: #6b6a65; --side: #2a2a28; --side-text: #e8e7e2;
    --accent: #e4002b; --accent-text: #ffffff;
    --good: #1a7f4b; --good-bg: #e3f4ea; --warn: #9a6200; --warn-bg: #fbf0d6;
    --info: #1f5fbf; --info-bg: #e4edfb; --bad: #b3261e; --bad-bg: #fbe6e4; --mute-bg: #ecebe7;
  }
  /* Dark: when the system asks for it, unless the settings say light; or when the settings say dark. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme=light]) {
      --bg: #151514; --card: #1f1f1d; --line: #33322f; --text: #ecebe6; --soft: #9c9a93; --side: #1b1b19; --side-text: #ecebe6;
      --accent: #ff4d5e; --accent-text: #1a0508;
      --good: #6fd39b; --good-bg: #173524; --warn: #f0c36a; --warn-bg: #3a2e12;
      --info: #8ab4f8; --info-bg: #1a2a45; --bad: #f2928b; --bad-bg: #40201d; --mute-bg: #2a2a27;
    }
  }
  :root[data-theme=dark] {
    --bg: #151514; --card: #1f1f1d; --line: #33322f; --text: #ecebe6; --soft: #9c9a93; --side: #1b1b19; --side-text: #ecebe6;
    --accent: #ff4d5e; --accent-text: #1a0508;
    --good: #6fd39b; --good-bg: #173524; --warn: #f0c36a; --warn-bg: #3a2e12;
    --info: #8ab4f8; --info-bg: #1a2a45; --bad: #f2928b; --bad-bg: #40201d; --mute-bg: #2a2a27;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  /* The frame: the menu on the left, the page next to it. */
  .shell { display: grid; grid-template-columns: 210px minmax(0, 1fr); min-height: 100vh; }
  aside { background: var(--side); color: var(--side-text); padding: 14px 0; }
  .brand { display: flex; align-items: baseline; gap: 6px; padding: 2px 18px 14px; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  .brand small { font-size: 12px; font-weight: 400; opacity: .6; }
  #menu { all: unset; display: none; cursor: pointer; margin-left: auto; padding: 2px 8px; font-size: 20px; }
  nav button { all: unset; box-sizing: border-box; display: block; width: 100%; cursor: pointer; padding: 9px 18px;
               border-left: 3px solid transparent; font-size: 15px; }
  nav button:hover { background: rgba(255,255,255,.06); }
  nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  nav button.on { border-left-color: var(--accent); color: var(--accent); font-weight: 600; }
  nav button.child { padding: 7px 18px 7px 34px; font-size: 14px; }
  nav .head { padding: 14px 18px 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; opacity: .55; }
  nav .dot { display: inline-block; min-width: 18px; margin-left: 6px; padding: 0 5px; border-radius: 99px; text-align: center;
             font-size: 11px; font-weight: 700; background: var(--accent); color: var(--accent-text); }
  .content { padding: 18px 22px 60px; max-width: 1180px; width: 100%; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 14px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
  h2 { font-size: 17px; margin: 22px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  h2:first-child { margin-top: 0; }
  .grow { flex: 1; }
  .line { color: var(--soft); font-size: 13px; }
  button, a.btn { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 7px; cursor: pointer;
           border: 1px solid var(--line); background: var(--card); color: var(--text); }
  a.btn { text-decoration: none; display: inline-block; }
  button:hover, a.btn:hover { border-color: var(--soft); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button.danger { color: var(--bad); border-color: var(--bad); }
  button.quiet { border-color: transparent; background: none; color: var(--soft); padding: 6px 8px; }
  button.quiet:hover { color: var(--text); }
  .chip, .badge { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 99px;
                  background: var(--mute-bg); color: var(--soft); white-space: nowrap; }
  .badge.ok { background: var(--good-bg); color: var(--good); }
  .badge.error { background: var(--bad-bg); color: var(--bad); }
  .badge.sent { background: var(--info-bg); color: var(--info); }
  .badge.review { background: var(--warn-bg); color: var(--warn); }
  .notice { background: var(--bad-bg); color: var(--bad); border-radius: 9px; padding: 10px 14px; margin-bottom: 14px; overflow-wrap: anywhere; }
  .notice.warn { background: var(--warn-bg); color: var(--warn); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(124px, 1fr)); gap: 10px; margin-bottom: 16px; }
  /* Each tile is a button: it shows only the games that belong to it. */
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px;
          text-align: left; font-size: 15px; }
  .stat b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--soft); font-size: 13px; }
  .stat.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .stat.on span { color: var(--text); }
  .stat.alert b { color: var(--bad); }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; align-items: center; }
  .tabs input, .tabs select { font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 7px; border: 1px solid var(--line);
                background: var(--card); color: var(--text); }
  .tabs input { min-width: 160px; }
  .tabs label { color: var(--soft); font-size: 13px; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; }
  .head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 14px; }
  .head > .grow { min-width: 230px; }
  .title { font-weight: 600; }
  .sub { color: var(--soft); font-size: 13px; font-variant-numeric: tabular-nums; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .score { display: inline-flex; align-items: baseline; justify-content: center; min-width: 54px; padding: 3px 9px;
           border-radius: 8px; font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums;
           background: var(--mute-bg); color: var(--soft); }
  .score small { font-weight: 400; font-size: 11px; opacity: .8; margin-left: 1px; }
  .score.high { background: var(--good-bg); color: var(--good); }
  .score.good { background: var(--info-bg); color: var(--info); }
  .score.mid { background: var(--warn-bg); color: var(--warn); }
  .toggle { all: unset; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; flex: 1; min-width: 230px; }
  .toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
  .toggle .arrow { color: var(--soft); width: 14px; flex: none; transition: transform .12s; margin-top: 2px; }
  .toggle[aria-expanded=true] .arrow { transform: rotate(90deg); }
  .toggle:hover .title { text-decoration: underline; }
  .cand { display: grid; grid-template-columns: 64px 1fr auto; gap: 4px 12px; padding: 9px 14px; align-items: start; border-top: 1px solid var(--line); }
  .cand.first { background: color-mix(in srgb, var(--good-bg) 35%, transparent); }
  .cand .name { overflow-wrap: anywhere; }
  .cand.fell { grid-template-columns: 96px 1fr auto; opacity: .85; }
  .rest button.quiet { padding: 2px 4px; }
  .cand a { color: inherit; }
  .cand .acts { display: flex; gap: 4px; align-items: center; }
  .part { border-top: 1px solid var(--line); padding: 8px 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
          background: color-mix(in srgb, var(--mute-bg) 45%, transparent); }
  .part b { font-weight: 600; }
  .rest { border-top: 1px solid var(--line); padding: 9px 14px; color: var(--soft); font-size: 13px; }
  .more { color: var(--soft); font-size: 13px; overflow-wrap: anywhere; font-weight: 400; }
  .confirm { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; }
  .sent-row { border-top: 1px solid var(--line); padding: 9px 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .empty { color: var(--soft); text-align: center; padding: 40px 0; }
  .log { font-size: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 4px 14px; }
  .log div { padding: 6px 0; border-bottom: 1px solid var(--line); display: flex; gap: 12px; }
  .log div:last-child { border-bottom: none; }
  .log div div { display: block; border: none; padding: 0; }
  .log time { color: var(--soft); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .log .error { color: var(--bad); } .log .warn { color: var(--warn); } .log .grab { color: var(--good); }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text); color: var(--bg);
           padding: 9px 16px; border-radius: 9px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; z-index: 30; }
  #toast.show { opacity: 1; }
  /* A table: the games, the services, the backups. */
  .table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; font-size: 14px; }
  .scroll { overflow-x: auto; }
  .table th, .table td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .table tr:last-child td { border-bottom: none; }
  .table th { color: var(--soft); font-weight: 600; font-size: 13px; white-space: nowrap; }
  .table th button { all: unset; cursor: pointer; }
  .table th button:hover, .table td button.linkish:hover { text-decoration: underline; }
  .table td.num, .table th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .table td button.linkish { all: unset; cursor: pointer; font-weight: 600; }
  .table td .acts { display: flex; gap: 4px; justify-content: flex-end; flex-wrap: wrap; }
  /* The cards of the indexers, the download clients and the connections. */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-bottom: 8px; }
  .pcard { all: unset; box-sizing: border-box; cursor: pointer; background: var(--card); border: 1px solid var(--line); border-radius: 10px;
           padding: 14px 16px; min-height: 104px; display: flex; flex-direction: column; gap: 6px; }
  .pcard:hover { border-color: var(--soft); }
  .pcard:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pcard .name { font-size: 18px; overflow-wrap: anywhere; }
  .pcard .says { color: var(--soft); font-size: 13px; overflow-wrap: anywhere; }
  .pcard .says.bad { color: var(--bad); }
  .pcard.add { align-items: center; justify-content: center; font-size: 40px; color: var(--soft); border-style: dashed; }
  /* The window over the page in which one of them is edited. */
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: flex-start; justify-content: center;
           padding: 6vh 12px 12px; overflow-y: auto; z-index: 20; }
  .dialog { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; width: 100%; max-width: 640px; padding: 18px 20px; }
  .dialog h2 { margin-top: 0; }
  .dialog .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
  .types { display: grid; gap: 8px; }
  .types button { text-align: left; padding: 12px 14px; font-size: 15px; }
  .types small { display: block; color: var(--soft); font-size: 13px; }
  fieldset { background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin: 0 0 12px; padding: 14px 16px 6px; }
  legend { font-weight: 600; padding: 0 6px; }
  .field { display: grid; grid-template-columns: 190px 1fr; gap: 4px 14px; align-items: center; margin-bottom: 12px; }
  .field label { color: var(--soft); font-size: 14px; }
  .field .help { grid-column: 2; color: var(--soft); font-size: 13px; }
  .field .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .field input[type=text], .field input[type=url], .field input[type=password], .field input[type=number], .field select {
    font: inherit; width: 100%; padding: 7px 10px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); }
  .dialog .field input, .dialog .field select { background: var(--card); }
  .field .row input { flex: 1; min-width: 140px; }
  .field input:focus, .field select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .field input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
  .testresult { font-size: 14px; overflow-wrap: anywhere; } .testresult.ok { color: var(--good); } .testresult.bad { color: var(--bad); }
  .savebar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 4px 0 18px; }
  .authcard { max-width: 380px; margin: 8vh auto 0; background: var(--card); border: 1px solid var(--line);
              border-radius: 12px; padding: 24px; display: grid; gap: 8px; }
  .authcard h2 { font-size: 17px; margin: 6px 0 0; border: none; padding: 0; }
  .authcard p { margin: 0 0 6px; }
  .authcard label { color: var(--soft); font-size: 14px; margin-top: 6px; display: block; }
  .authcard input { font: inherit; width: 100%; padding: 8px 10px; border-radius: 7px; border: 1px solid var(--line);
                    background: var(--bg); color: var(--text); }
  .authcard input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .authcard button { margin-top: 10px; padding: 9px 12px; font-size: 15px; }
  .authcard .testresult:empty { display: none; }
  @media (max-width: 760px) {
    /* On a phone the menu folds away above the page. */
    .shell { grid-template-columns: 1fr; }
    aside { padding: 10px 0 6px; }
    .brand { padding-bottom: 6px; }
    #menu { display: block; }
    aside:not(.open) nav { display: none; }
    .content { padding: 14px 16px 60px; }
    #shown { flex-basis: 100%; }
    .cand, .cand.fell { grid-template-columns: 1fr; }
    .field { grid-template-columns: 1fr; } .field .help { grid-column: 1; }
  }
</style>
</head>
<body>
<div id="app" class="shell" hidden>
  <aside id="side">
    <div class="brand">NSWHunter <small id="version"></small>
      <button id="menu" aria-label="Menu" aria-expanded="false">☰</button></div>
    <nav id="nav" aria-label="Pages"></nav>
  </aside>
  <div class="content">
    <header>
      <h1 id="pagetitle"></h1>
      <span class="line grow" id="statusline">Loading…</span>
      <button class="primary" id="sync">Sync now</button>
      <button class="quiet" id="logout" title="Log out of the panel in this browser">Log out</button>
    </header>
    <div id="notice"></div>
    <section id="page-games" hidden>
      <div class="tabs" id="gametools"></div>
      <div class="scroll" id="gamelist"></div>
      <div class="empty" id="gamemore"></div>
    </section>
    <section id="page-wanted" hidden>
      <div class="stats" id="stats"></div>
      <div class="tabs" id="tools"></div>
      <div id="list"></div>
    </section>
    <section id="page-settings" hidden>
      <form id="config" autocomplete="off"></form>
      <div id="extra"></div>
    </section>
    <section id="page-status" hidden><div id="status"></div></section>
    <section id="page-log" hidden>
      <div class="tabs" id="logtools"></div>
      <div class="log" id="log"></div>
      <div class="empty" id="logmore"></div>
    </section>
  </div>
</div>
<section id="auth" hidden>
  <form id="authform" class="authcard">
    <h1>NSWHunter</h1>
    <h2 id="authtitle">Log in</h2>
    <p class="line" id="authtext"></p>
    <label for="auth-user">Username</label>
    <input id="auth-user" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <label for="auth-password" id="auth-password-label">Password</label>
    <input id="auth-password" type="password" autocomplete="current-password" required>
    <div id="auth-repeat-row" hidden>
      <label for="auth-repeat">New password again</label>
      <input id="auth-repeat" type="password" autocomplete="new-password">
    </div>
    <div class="testresult bad" id="autherror" role="alert"></div>
    <button class="primary" type="submit" id="authgo">Log in</button>
  </form>
</section>
<div id="modal" hidden></div>
<div id="toast"></div>
<script>
// Release names come from indexers: everything is put on the page as text, never as HTML.
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) if (c !== null && c !== undefined && c !== false) el.append(c);
  return el;
}
const $ = id => document.getElementById(id);
function put(el, ...children) {
  el.replaceChildren(...children.flat().filter(c => c !== null && c !== undefined && c !== false));
}
// The choice is kept in this browser; without storage it is simply the default again.
function remembered(key, fallback) {
  try { return localStorage.getItem("nswhunter-" + key) || fallback; } catch (e) { return fallback; }
}
function remember(key, value) {
  try { localStorage.setItem("nswhunter-" + key, value); } catch (e) { /* private window */ }
}

// The pages of the menu on the left. kind: a page of the settings that is a list of cards.
const PAGES = [
  {id: "games", text: "Games"},
  {id: "wanted", text: "Wanted"},
  {head: "Settings"},
  {id: "media", text: "Media Management", sub: true, settings: true},
  {id: "indexers", text: "Indexers", sub: true, settings: true, kind: "INDEXERS"},
  {id: "clients", text: "Download Clients", sub: true, settings: true, kind: "DOWNLOAD_CLIENTS"},
  {id: "connect", text: "Connect", sub: true, settings: true, kind: "CONNECTIONS"},
  {id: "general", text: "General", sub: true, settings: true},
  {id: "ui", text: "UI", sub: true, settings: true},
  {head: "System"},
  {id: "status", text: "Status", sub: true},
  {id: "log", text: "Log", sub: true},
];
const pageOf = id => PAGES.find(p => p.id === id);

let state = null, needle = "", busy = new Set(), expanded = new Set(), fallen = new Set(), thrown = new Set();
let page = pageOf(location.hash.slice(1)) ? location.hash.slice(1) : "wanted";
let settings = null, clearing = new Set(), opened = false, tests = {}, confirming = false, editing = null, backups = null;
let only = remembered("only", "choice"), sortBy = remembered("sort", "score"), flipped = remembered("flipped", "") === "1";
let auth = null;  // "login" or "change" while the login screen is up
let events = null, logLevel = remembered("loglevel", "all"), logNeedle = "", logShown = 100;
let library = null, gameNeedle = "", gameOnly = remembered("games", "all"), gameSort = "name", gameDown = false, gameShown = 200;
let ui = {theme: "auto", date: "browser", time: "browser", relative: true};
const BULK = 9;  // "Download all" takes the best release of a game from this score on

// Every call to the server. Without a login the server says so, and the login screen comes up.
const LOGIN = new Error("login");
async function request(path, body) {
  const options = body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)};
  const r = await fetch(path, options);
  const data = await r.json().catch(() => ({ok: false, error: "HTTP " + r.status}));
  if (r.status === 401 && data.login) { needLogin("login"); throw LOGIN; }
  if (r.status === 403 && data.change) { needLogin("change"); throw LOGIN; }
  return {status: r.status, ok: r.ok, data};
}

// ---------------------------------------------------------------- logging in
function needLogin(mode) {
  if (auth === mode) return;
  auth = mode;
  const change = mode === "change";
  $("app").hidden = true; $("auth").hidden = false; closeModal();
  $("authtitle").textContent = change ? "Choose your own password" : "Log in";
  $("authtext").textContent = change
    ? "You logged in with the password NSWHunter made up. Choose a password of your own of at least 8 characters before you go on; you can change the username too."
    : "";
  $("auth-password-label").textContent = change ? "New password" : "Password";
  $("auth-repeat-row").hidden = !change;
  $("auth-password").setAttribute("autocomplete", change ? "new-password" : "current-password");
  $("authgo").textContent = change ? "Save and go on" : "Log in";
  $("autherror").textContent = "";
  $("auth-password").value = ""; $("auth-repeat").value = "";
  (change && $("auth-user").value ? $("auth-password") : $("auth-user")).focus();
}
$("authform").addEventListener("submit", async e => {
  e.preventDefault();
  const user = $("auth-user").value.trim(), password = $("auth-password").value, change = auth === "change";
  const say = text => { $("autherror").textContent = text; };
  if (change && password.length < 8) return say("Use at least 8 characters for the password.");
  if (change && password !== $("auth-repeat").value) return say("The two passwords are not the same.");
  $("authgo").disabled = true; say("");
  try {
    const r = await fetch(change ? "/api/password" : "/api/login", {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({user, password})});
    const data = await r.json().catch(() => ({ok: false, error: "HTTP " + r.status}));
    if (r.status === 401 && data.login) { auth = null; needLogin("login"); return; }
    if (!data.ok) { say(data.error || "Failed"); $("auth-password").select(); return; }

function typed(form) {

        h("div", {}, h("span", {class: "badge " + (settings.values.SLM_URL ? "ok" : "")}, settings.values.SLM_URL ? "Set up" : "Not set up")),
        settings.values.SLM_URL && library ? h("div", {class: "says" + (library.ok ? "" : " bad")}, (library.ok ? "✓ " : "✕ ") + library.text) : null)),
      h("h2", {}, "Notifications")] : null,
    h("div", {class: "cards"},
      settings.providers[kind].map(entry => h("button", {class: "pcard", onclick: () => openEditor({kind, entry: {...entry}})},
        h("div", {class: "name"}, entry.name),
        h("div", {}, h("span", {class: "badge " + (entry.enabled ? "ok" : "")}, entry.enabled ? "Enabled" : "Disabled"),
          " ", h("span", {class: "badge"}, schema[entry.type].label)),
        says(kind, entry))),
      h("button", {class: "pcard add", "aria-label": "Add", title: "Add", onclick: () => openEditor({kind, choose: true})}, "+")));
}
// The window in which one entry is added or changed.
function openEditor(what) { editing = {...what, test: null, busy: false}; clearing.clear(); renderEditor(); }
function closeModal() { editing = null; $("modal").hidden = true; put($("modal")); }
function entryFromForm() {
  const form = $("editor"), values = typed(form), entry = {...editing.entry, ...values};
  entry.clear = [...clearing].filter(n => n.startsWith("e")).map(n => n.slice(1));
  delete entry.secrets;
  return entry;
}
function renderEditor() {
  if (!editing) return;
  const modal = $("modal");
  modal.hidden = false;
  if (editing.choose) {
    const schema = settings.schema[editing.kind];
    put(modal, h("div", {class: "dialog", role: "dialog", "aria-modal": "true", "aria-label": "Add"},
      h("h2", {}, "Add"),
      h("div", {class: "types"}, Object.entries(schema).map(([type, spec]) =>
        h("button", {onclick: () => openEditor({kind: editing.kind, entry: {type, name: spec.label.replace(/ \(.*/, ""), enabled: true, secrets: {}}})},
          spec.label, h("small", {}, TYPE_HELP[editing.kind + "." + type] || TYPE_HELP[type] || "")))),
      h("div", {class: "bar"}, h("span", {class: "grow"}), h("button", {onclick: closeModal}, "Cancel"))));
    modal.querySelector("button").focus();
    return;
  }
  const result = editing.test ? h("span", {class: "testresult " + (editing.test.ok ? "ok" : "bad")}, (editing.test.ok ? "✓ " : "✕ ") + editing.test.text) : null;
  const build = keep => {
    let title, fields, values, secrets, isNew = false, canDelete = false;
    if (editing.library) {
      title = "Switch-library-manager-web";
      values = {...settings.values, ...(keep || {})}; secrets = settings.secrets;
      fields = [{name: "SLM_URL", label: "Address", placeholder: "http://192.168.1.10:3000"},
        {name: "SLM_API_KEY", label: "API key", secret: true,
         help: "Make it in Switch-library-manager-web under My account > API keys > Make a key. Read only is enough; with the Editor role NSWHunter can also ask for a scan right after a download. The key starts with slm_ and is shown only once. If login is switched off there, leave this field empty."}];
    } else {
      const spec = settings.schema[editing.kind][editing.entry.type];
      editing.entry = {...editing.entry, ...(keep || {})};
      isNew = !editing.entry.id; canDelete = !isNew;
      title = (isNew ? "Add " : "") + spec.label;
      values = editing.entry; secrets = editing.entry.secrets || {};
      fields = [{name: "name", label: "Name"}, {name: "enabled", label: "Enabled", checkbox: true},
        ...Object.entries(spec.fields).map(([name, type]) => ({
          name, label: LABELS[name] || name, secret: type === "secret", checkbox: type === "bool", number: type === "priority",
          help: HELP[editing.entry.type + "." + name] || HELP[name] || ""}))];
      if (values.priority === undefined) values.priority = 25;
      if (values.categories === undefined && "categories" in spec.fields) values.categories = "1000";
      if (values.category === undefined && "category" in spec.fields) values.category = "games";
      if (!Object.keys(spec.fields).length) fields.push({name: "_", label: "", local: true, note: TYPE_HELP[editing.kind + "." + editing.entry.type] || ""});
    }
    put(modal, h("div", {class: "dialog", role: "dialog", "aria-modal": "true", "aria-label": title},
      h("h2", {}, title),
      h("form", {id: "editor", autocomplete: "off", onsubmit: e => { e.preventDefault(); saveEditor(); }},
        fields.map(f => f.note !== undefined ? h("p", {class: "line"}, f.note) : fieldRow(f, values, secrets, "e")),
        h("div", {class: "bar"},
          canDelete ? (confirming === "delete"
            ? [h("span", {class: "line"}, "Remove it?"), h("button", {type: "button", class: "danger", onclick: deleteEditor}, "Yes, remove"),
               h("button", {type: "button", onclick: () => { confirming = false; rerender(); }}, "No")]
            : h("button", {type: "button", class: "danger", onclick: () => { confirming = "delete"; rerender(); }}, "Delete")) : null,
          h("span", {class: "grow"}),
          h("button", {type: "button", disabled: editing.busy, onclick: testEditor}, editing.busy === "test" ? "Testing…" : editing.kind === "CONNECTIONS" ? "Send test message" : "Test"),
          h("button", {type: "button", onclick: closeModal}, "Cancel"),
          h("button", {class: "primary", type: "submit", disabled: editing.busy}, "Save")),
        h("div", {class: "bar"}, result))));
  };
  rerender = () => { if (editing) keepTyped(() => $("editor"), build); };
  if ($("editor")) rerender(); else { build(); const first = modal.querySelector("input"); if (first) first.focus(); }
}
async function testEditor() {
  const body = editing.library ? {values: typed($("editor")), clear: [...clearing].filter(n => n.startsWith("e")).map(n => n.slice(1))}
    : {kind: editing.kind, entry: entryFromForm()};
  editing.busy = "test"; editing.test = null; renderEditor();
  try {
    const {data} = await request(editing.library ? "/api/test" : "/api/provider/test", body);
    if (editing) editing.test = {ok: data.ok === true, text: data.text || "Failed"};
  } catch (e) {
    if (editing) editing.test = {ok: false, text: e === LOGIN ? "Log in first" : "No connection to NSWHunter"};
  }
  if (editing) { editing.busy = false; renderEditor(); }
}
async function saveEditor() {
  const body = editing.library ? {values: typed($("editor")), clear: [...clearing].filter(n => n.startsWith("e")).map(n => n.slice(1))}
    : {kind: editing.kind, entry: entryFromForm()};
  editing.busy = "save"; renderEditor();
  try {
    const {data} = await request(editing.library ? "/api/settings" : "/api/provider", body);
    if (!data.ok) { editing.busy = false; editing.test = {ok: false, text: data.error || "Saving failed"}; renderEditor(); return; }
    settings = data;
    toast(data.tested === false ? "Saved, but it does not answer: " + data.text : "Saved");
    closeModal(); confirming = false;
    await load();
  } catch (e) {
    if (editing) { editing.busy = false; editing.test = {ok: false, text: e === LOGIN ? "Log in first" : "No connection to NSWHunter"}; renderEditor(); }
  }
}
async function deleteEditor() {
  try {
    const {data} = await request("/api/provider/delete", {kind: editing.kind, id: editing.entry.id});
    if (!data.ok) return toast(data.error || "Failed");
    settings = data; confirming = false;
    closeModal(); toast("Removed");
    await load();
  } catch (e) {
    if (e !== LOGIN) toast("No connection to NSWHunter");
  }
}
document.addEventListener("keydown", e => { if (e.key === "Escape" && editing) closeModal(); });
$("modal").addEventListener("mousedown", e => { if (e.target === $("modal")) closeModal(); });

// ---------------------------------------------------------------- the frame
async function openSettings() {
  try {
    const {data, ok} = await request("/api/settings");
    if (!ok) throw new Error();
    settings = data; clearing.clear();
    renderSettings();
  } catch (e) {
    if (e !== LOGIN) toast("Could not load the settings");
  }
}
function renderSettings() {
  if (!settings || !pageOf(page).settings) return;
  if (pageOf(page).kind) renderCards(); else renderForm();
}
function show(name) {
  page = name; confirming = false;
  try { history.replaceState(null, "", "#" + name); } catch (e) { /* the address stays as it is */ }
  const here = pageOf(name);
  $("side").classList.remove("open"); $("menu").setAttribute("aria-expanded", "false");
  for (const id of ["games", "wanted", "settings", "status", "log"]) $("page-" + id).hidden = id !== (here.settings ? "settings" : name);
  if (here.settings) { put($("config")); put($("extra")); openSettings(); }
  if (name === "log") { renderLogTools(); renderLog(); loadLog(); }
  if (name === "games") { renderGameTools(); renderGames(); loadGames(); }
  render();
}
$("menu").addEventListener("click", () => {
  const open = $("side").classList.toggle("open");
  $("menu").setAttribute("aria-expanded", open ? "true" : "false");
});
function render() {
  if (!state) return;
  ui = state.ui || ui;
  if (ui.theme === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", ui.theme);
  $("version").textContent = "v" + state.version;
  const st = state.status, here = pageOf(page);
  $("pagetitle").textContent = (here.settings ? "Settings: " : "") + here.text;
  $("statusline").textContent = st.running ? "Busy: " + (st.phase || "…")
    : "Last round " + ago(st.last_run) + (st.next_run ? " · next in " + Math.max(0, Math.round((st.next_run - state.now) / 60)) + " min" : "");
  $("sync").disabled = st.running || !state.configured;
  const errors = Object.entries(state.services).filter(([name, s]) => !s.ok && name !== "config");
  const choices = new Set(state.items.filter(waiting).map(i => i.game_id)).size;  // games, as on the tile
  put($("nav"), PAGES.map(p => p.head ? h("div", {class: "head"}, p.head)
    : h("button", {class: (p.sub ? "child" : "") + (page === p.id ? " on" : ""), "aria-current": page === p.id ? "page" : null, onclick: () => show(p.id)},
        p.text,
        p.id === "wanted" && choices ? h("span", {class: "dot", title: plural(choices, "game") + " awaiting your choice"}, choices) : null,
        p.id === "status" && (errors.length || st.error) ? h("span", {class: "dot", title: "Something does not work"}, "!") : null)));
  put($("notice"),
    !state.configured ? h("div", {class: "notice warn"}, "NSWHunter is not set up yet. " + state.missing.join(". ") + ".") : null,
    // A round that broke is said on every page, not only in the log.
    st.error ? h("div", {class: "notice"}, "The last round did not finish (" + ago(st.error.at) + "). " + st.error.text + " The Log page has the details.") : null,
    st.skipped ? h("div", {class: "notice warn"}, "The last round left out " + plural(st.skipped, "game or release", "games or releases") + " because of an error; the rest went on. The Log page says which.") : null,
    ...(state.configured ? errors.map(([, s]) => h("div", {class: "notice"}, s.name && !s.text.startsWith(s.name) ? s.name + ": " + s.text : s.text)) : []));
  if (page === "wanted") renderWanted();
  if (page === "status") renderStatus();
  if (page === "games") renderGames();

  if (here.kind && settings && !editing) renderCards();
}
async function load() {
  if (auth) return;  // the login screen is up: nothing to fetch until it is passed
  try {
    const {data, ok} = await request("/api/state");
    if (!ok) throw new Error();
    state = data;
    $("app").hidden = false;
    // First visit without settings: go straight to where they are filled in.
    if (!opened) { opened = true; show(!state.configured && page === "wanted" ? "connect" : page); return; }
    // Keep typing in the filter box and keep the sort list open: only rebuild around them.
    if (["filter", "sort"].includes(document.activeElement && document.activeElement.id)) renderList(); else render();
    if (page === "log") loadLog();
  } catch (e) {
    if (e !== LOGIN) { $("app").hidden = false; $("statusline").textContent = "No connection to NSWHunter"; }
  }
}
$("sync").addEventListener("click", async () => {
  try {
    await request("/api/sync", {});
    toast("Round started"); setTimeout(load, 1500);
  } catch (e) {
    if (e !== LOGIN) toast("No connection to NSWHunter");
  }
});
load();
setInterval(load, 8000);
</script>
