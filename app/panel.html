<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NSWHunter</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='4' fill='%23e4002b'/><path d='M4 8.5l2.5 2.5L12 5.5' stroke='white' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
  /* The look follows Sonarr and Radarr: a bar on top, the menu on the left, a toolbar per page. */
  :root {
    --bg: #ffffff; --panel: #f5f5f5; --card: #ffffff; --input: #ffffff; --line: #e5e5e5; --edge: #b9b9b9;
    --text: #333333; --head: #222222; --soft: #737d83;
    --top: #464b51; --side: #595959; --side-on: #333333; --bar: #3a3f51; --on-dark: #e1e2e3;
    --accent: #e4002b; --accent-on-dark: #ff5c6c; --link: #2f6fd0;
    --good: #1e7a3c; --good-bg: #dff3e3; --warn: #8a5a00; --warn-bg: #fbf0d6;
    --info-bg: #e6f0fb; --info-line: #5d9cec; --bad: #c9302c; --bad-bg: #fbe3e2; --mute-bg: #ececec;
    --shadow: 0 0 10px 1px rgba(38, 38, 38, .15);
  }
  /* Dark: when the system asks for it, unless the settings say light; or when the settings say dark. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme=light]) {
      --bg: #202020; --panel: #262626; --card: #333333; --input: #333333; --line: #404040; --edge: #858585;
      --text: #cccccc; --head: #e1e2e3; --soft: #909293;
      --top: #2a2a2a; --side: #2a2a2a; --side-on: #333333; --bar: #262626; --on-dark: #e1e2e3;
      --accent: #ff5c6c; --accent-on-dark: #ff5c6c; --link: #5d9cec;
      --good: #9be3b0; --good-bg: #1d5e33; --warn: #f0c36a; --warn-bg: #4a3a12;
      --info-bg: #1f1f3d; --info-line: #2e6da4; --bad: #f58a85; --bad-bg: #5a2523; --mute-bg: #444444;
      --shadow: 0 0 10px 1px rgba(0, 0, 0, .25);
    }
  }
  :root[data-theme=dark] {
    --bg: #202020; --panel: #262626; --card: #333333; --input: #333333; --line: #404040; --edge: #858585;
    --text: #cccccc; --head: #e1e2e3; --soft: #909293;
    --top: #2a2a2a; --side: #2a2a2a; --side-on: #333333; --bar: #262626; --on-dark: #e1e2e3;
    --accent: #ff5c6c; --accent-on-dark: #ff5c6c; --link: #5d9cec;
    --good: #9be3b0; --good-bg: #1d5e33; --warn: #f0c36a; --warn-bg: #4a3a12;
    --info-bg: #1f1f3d; --info-line: #2e6da4; --bad: #f58a85; --bad-bg: #5a2523; --mute-bg: #444444;
    --shadow: 0 0 10px 1px rgba(0, 0, 0, .25);
  }
  /* Color-impaired mode: blue for good and orange for bad, which stay apart without red and green. */
  :root[data-impaired] { --good: #1f5fa8; --good-bg: #dbe8f7; --bad: #a84a00; --bad-bg: #fbe6d4; }
  @media (prefers-color-scheme: dark) {
    :root[data-impaired]:not([data-theme=light]) { --good: #8cc2ff; --good-bg: #1d3f66; --bad: #ffb36b; --bad-bg: #5c3312; }
  }
  :root[data-impaired][data-theme=dark] { --good: #8cc2ff; --good-bg: #1d3f66; --bad: #ffb36b; --bad-bg: #5c3312; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 Roboto, "Open Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
  .icon { width: 18px; height: 18px; fill: currentColor; flex: none; }

  /* ---- the frame */
  .shell { display: grid; grid-template-columns: 210px minmax(0, 1fr); grid-template-rows: 60px 1fr; min-height: 100vh; }
  #top { grid-column: 1 / -1; background: var(--top); color: var(--on-dark); display: flex; align-items: center; gap: 14px; padding: 0 20px 0 0; }
  .brand { text-decoration: none; width: 210px; flex: none; padding-left: 20px; font-size: 22px; font-weight: 700; letter-spacing: -.01em; color: var(--accent-on-dark); white-space: nowrap; }
  .brand small { font-size: 12px; font-weight: 400; color: var(--on-dark); opacity: .6; margin-left: 4px; }
  .find { display: flex; align-items: center; gap: 8px; color: var(--on-dark); }
  .find input { all: unset; width: 200px; padding: 4px 2px; border-bottom: 1px solid var(--on-dark); color: var(--on-dark); font-size: 14px; }
  .find input::placeholder { color: var(--on-dark); opacity: .8; }
  .find input:focus { border-bottom-color: var(--accent-on-dark); }
  #topright { display: flex; align-items: center; }
  #top button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 4px; white-space: nowrap; }
  #top button:hover { color: var(--accent-on-dark); }
  #top button:focus-visible { outline: 2px solid var(--accent-on-dark); }
  #menu { display: none !important; font-size: 20px; margin-left: 10px; }
  aside { background: var(--side); color: var(--on-dark); display: flex; flex-direction: column; }
  /* What NSWHunter is doing, at the foot of the menu, where Sonarr and Radarr put their messages. */
  #sidefoot { margin-top: auto; position: sticky; bottom: 0; padding: 14px 24px; font-size: 12px; line-height: 1.4; opacity: .75; overflow-wrap: anywhere; }
  nav button { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 12px; width: 100%; cursor: pointer;
               padding: 12px 24px; border-left: 3px solid transparent; font-size: 14px; }
  nav button:hover { color: var(--accent-on-dark); }
  nav button:focus-visible { outline: 2px solid var(--accent-on-dark); outline-offset: -2px; }
  nav .group.on { background: var(--side-on); border-left: 3px solid var(--accent-on-dark); }
  nav .group.on > button { border-left: none; padding-left: 21px; }
  nav .group.on > button.parent, nav button.on { color: var(--accent-on-dark); }
  nav button.child { padding: 9px 24px 9px 51px; }
  nav .count { margin-left: auto; min-width: 20px; padding: 0 6px; border-radius: 3px; text-align: center; font-size: 12px;
               font-weight: 700; background: #5d9cec; color: #fff; }
  nav .count.alert { background: #ffa500; }
  .page { min-width: 0; display: flex; flex-direction: column; }
  .toolbar { background: var(--bar); color: var(--on-dark); display: flex; align-items: stretch; flex-wrap: wrap; gap: 2px; min-height: 60px; padding: 0 20px; }
  .toolbar .tool { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center;
                   gap: 2px; min-width: 60px; padding: 6px 10px; font-size: 11px; line-height: 1.2; text-align: center; }
  .toolbar .tool .icon { width: 21px; height: 21px; }
  .toolbar .tool:hover { color: var(--accent-on-dark); }
  .toolbar .tool:disabled { opacity: .45; cursor: default; color: inherit; }
  .toolbar .tool:focus-visible { outline: 2px solid var(--accent-on-dark); outline-offset: -2px; }
  .toolbar .sep { width: 1px; margin: 12px 8px; background: rgba(255, 255, 255, .25); }
  .toolbar .right { margin-left: auto; display: flex; align-items: stretch; gap: 2px; flex-wrap: wrap; min-width: 0; max-width: 100%; }
  .toolbar .right input { min-width: 0; width: 220px; flex: 0 1 auto; align-self: center; margin-right: 8px; font: inherit; font-size: 13px; padding: 5px 8px;
                          border-radius: 4px; border: 1px solid var(--edge); background: var(--input); color: var(--text); }
  /* A button with a short list under it: Sort and Filter in the toolbar, the account in the bar on top. */
  .menuwrap { position: relative; display: flex; }
  .menu { position: absolute; top: 100%; right: 0; z-index: 15; min-width: 190px; padding: 4px 0; background: var(--bar); color: var(--on-dark);
          border-radius: 0 0 4px 4px; box-shadow: 0 6px 16px rgba(0, 0, 0, .35); }
  .menu button, #top .menu button { all: unset; box-sizing: border-box; cursor: pointer; display: flex; justify-content: space-between; gap: 24px; width: 100%;
                                    padding: 10px 20px; font-size: 14px; white-space: nowrap; }
  .menu button:hover, #top .menu button:hover { background: rgba(255, 255, 255, .08); color: var(--accent-on-dark); }
  .menu button:focus-visible, #top .menu button:focus-visible { outline: 2px solid var(--accent-on-dark); outline-offset: -2px; }
  .menu button.on { font-weight: 700; }
  .menu .about { padding: 10px 20px; font-size: 12px; opacity: .7; white-space: nowrap; border-bottom: 1px solid rgba(255, 255, 255, .15); }
  .content { padding: 20px; width: 100%; }

  /* ---- what the pages are made of */
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 24px; font-weight: 300; color: var(--head); margin: 26px 0 14px; padding-bottom: 4px; border-bottom: 1px solid var(--edge); }
  h2:first-child { margin-top: 0; }
  a { color: var(--link); }
  .grow { flex: 1; }
  .line { color: var(--soft); font-size: 13px; }
  button, a.btn { font: inherit; font-size: 14px; padding: 6px 16px; border-radius: 4px; cursor: pointer;
                  border: 1px solid var(--edge); background: var(--card); color: var(--text); }
  a.btn { text-decoration: none; display: inline-block; }
  button:hover, a.btn:hover { border-color: var(--head); color: var(--head); }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--link); outline-offset: 1px; }
  button.primary { background: #1e7a3c; border-color: #1e7a3c; color: #fff; }
  button.danger { background: #c9302c; border-color: #c9302c; color: #fff; }
  button.quiet { border-color: transparent; background: none; color: var(--soft); padding: 6px 8px; }
  button.quiet:hover { color: var(--head); }
  button.small, a.btn.small { padding: 3px 10px; font-size: 13px; }
  .label { display: inline-block; margin: 2px 4px 2px 0; padding: 1px 6px; border-radius: 2px; font-size: 11px; font-weight: 700; line-height: 1.6;
           background: var(--mute-bg); color: var(--text); white-space: nowrap; }
  .label.ok { background: var(--good-bg); color: var(--good); }
  .label.error { background: var(--bad-bg); color: var(--bad); }
  .label.sent { background: var(--info-bg); color: var(--link); }
  .label.review { background: var(--warn-bg); color: var(--warn); }
  /* The state of a row, wide and in one colour, as the status of a movie in Radarr. */
  .label.wide { min-width: 104px; padding: 2px 8px; text-align: center; color: #fff; background: #6b6b6b; }
  .label.wide.ok { background: #1f8f3a; } .label.wide.danger { background: #d9342b; } .label.wide.warn { background: #b36b00; }
  .label.wide.info { background: #3a7bd5; } .label.wide.mute { background: #6b6b6b; }
  .alert { border: 1px solid var(--info-line); background: var(--info-bg); border-radius: 4px; padding: 12px 16px; margin-bottom: 16px; }
  .notice { background: var(--bad-bg); color: var(--bad); border-radius: 4px; padding: 10px 14px; margin-bottom: 14px; overflow-wrap: anywhere; }
  .notice.warn { background: var(--warn-bg); color: var(--warn); }
  .ask { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .sub { color: var(--soft); font-size: 13px; font-variant-numeric: tabular-nums; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .score { display: inline-flex; align-items: baseline; justify-content: center; min-width: 50px; padding: 2px 8px;
           border-radius: 3px; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; background: var(--mute-bg); color: var(--soft); }
  .score small { font-weight: 400; font-size: 11px; opacity: .8; margin-left: 1px; }
  .score.high { background: var(--good-bg); color: var(--good); }
  .score.good { background: var(--info-bg); color: var(--link); }
  .score.mid { background: var(--warn-bg); color: var(--warn); }
  /* One missing thing of a game in the window of its releases. */
  .part { margin: 14px 8px 0; padding: 8px 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid var(--edge); }
  .part b { font-size: 16px; font-weight: 400; color: var(--head); }
  /* The releases of one missing thing, in columns like a table. */
  .cand { display: grid; grid-template-columns: 62px minmax(0, 1fr) 150px 80px 96px auto; gap: 2px 12px; margin: 0 8px; padding: 8px 10px;
          align-items: start; border-bottom: 1px solid var(--line); }
  .cand.th { font-weight: 700; color: var(--head); font-size: 13px; padding-top: 6px; padding-bottom: 6px; }
  .cand .name { overflow-wrap: anywhere; color: var(--head); }
  .cand .name a { color: inherit; text-decoration: none; }
  .cand .name a:hover { color: var(--link); text-decoration: underline; }
  .cand.fell { opacity: .8; }
  .cand .acts, .acts { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .rest { margin: 0 8px; padding: 6px 10px; color: var(--soft); font-size: 13px; border-bottom: 1px solid var(--line); }
  .rest button.quiet { padding: 2px 4px; font-size: 13px; }
  .sent-row { margin: 0 8px; padding: 8px 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
  .empty { color: var(--soft); text-align: center; padding: 40px 0; }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--head); color: var(--bg);
           padding: 9px 16px; border-radius: 4px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; z-index: 30; }
  #toast.show { opacity: 1; }
  /* A table, as on every list page of Sonarr and Radarr. */
  .scroll { overflow-x: auto; }
  .table { width: 100%; border-collapse: collapse; }
  .table th, .table td { text-align: left; padding: 8px; vertical-align: middle; }
  .table td { border-top: 1px solid var(--line); }
  .table th { color: var(--head); font-weight: 700; white-space: nowrap; }
  .table tbody tr:hover { background: var(--panel); }
  .table th button { all: unset; cursor: pointer; }
  .table th button:hover { color: var(--link); }
  .table td.num, .table th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .table td.tight { white-space: nowrap; }
  .table td button.linkish { all: unset; cursor: pointer; color: var(--link); }
  .table td button.linkish:hover { text-decoration: underline; }
  .table td button.linkish:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .table td.check, .table th.check { width: 34px; padding-right: 0; }
  .table input[type=checkbox] { width: 18px; height: 18px; margin: 0; accent-color: #5d9cec; vertical-align: middle; }
  .table tr.picked { background: var(--info-bg); }
  .table td.done { color: var(--good); width: 40px; }
  /* A button in a row that is only a drawing. */
  .ibtn { all: unset; cursor: pointer; display: inline-flex; padding: 4px 6px; border-radius: 4px; color: var(--text); }
  .ibtn:hover { color: var(--link); }
  .ibtn:disabled { opacity: .35; cursor: default; color: var(--text); }
  .ibtn:focus-visible { outline: 2px solid var(--link); }
  .table .acts { flex-wrap: nowrap; gap: 2px; }
  .total { padding: 14px 8px; text-align: right; color: var(--soft); font-size: 13px; }
  /* Under a long list: the buttons to leaf through it in the middle, the number of records on the right. */
  .pager { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
  .pager .pages { display: flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
  .pager .pages span { padding: 0 10px; }
  /* A drawing that says what a row is. */
  .mark { display: inline-flex; vertical-align: middle; color: var(--soft); }
  .mark.good { color: var(--good); } .mark.bad { color: var(--bad); } .mark.warn { color: #d98200; } .mark.info { color: var(--link); }
  .label.usenet { background: #17a2c6; color: #fff; } .label.torrent { background: #1f8f3a; color: #fff; }
  /* The lines of a details window and of About: the name on the left, in bold. */
  .facts { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 8px 20px; margin: 0; }
  .facts dt { text-align: right; font-weight: 700; color: var(--head); }
  .facts dd { margin: 0; overflow-wrap: anywhere; }
  /* The Posters view of the games: a wall of pictures. */
  .posters { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px; }
  .poster { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; background: var(--card); box-shadow: var(--shadow);
            border-radius: 4px; overflow: hidden; text-align: center; padding-bottom: 8px; }
  .poster:hover { outline: 1px solid var(--edge); } .poster:focus-visible { outline: 2px solid var(--link); }
  .art { display: block; width: 100%; height: auto; aspect-ratio: 1; object-fit: cover; background: var(--mute-bg); }
  .poster .bar { height: 5px; background: #1f8f3a; } .poster .bar.danger { background: #d9342b; } .poster .bar.warn { background: #b36b00; }
  .poster .pname { padding: 8px 8px 2px; font-size: 13px; color: var(--head); overflow-wrap: anywhere; }
  /* The page of one game: its picture and what is known about it on top. */
  .ghead { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 8px; }
  .ghead .art { width: 170px; border-radius: 4px; flex: none; }
  .ginfo { flex: 1; min-width: 240px; display: grid; gap: 12px; }
  .ginfo h1 { font-size: 30px; font-weight: 300; color: var(--head); line-height: 1.2; overflow-wrap: anywhere; }
  .gfacts { display: flex; flex-wrap: wrap; gap: 6px 26px; }
  .gfacts b { color: var(--head); }
  /* A tick box with its name and a line about it, in a window that asks something. */
  .choice { display: flex; gap: 12px; align-items: flex-start; padding: 8px 0; cursor: pointer; }
  .choice input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: #5d9cec; flex: none; }
  .choice span.sub { display: block; }
  .mfoot .words { font: inherit; flex: 0 1 300px; min-width: 120px; padding: 6px 12px; border-radius: 4px; border: 1px solid var(--edge); background: var(--input); color: var(--text); }
  /* Setting up the second step of the login: the QR code with the key next to it. */
  .qrbox { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; margin: 6px 0 14px; }
  .qr { border-radius: 4px; flex: none; }
  .key { font-size: 15px; letter-spacing: .04em; margin: 4px 0 8px; overflow-wrap: anywhere; color: var(--head); }
  .tabs { display: flex; flex-wrap: wrap; gap: 12px; margin: 14px 0; align-items: center; }
  /* Updates: a version, and under it what changed. */
  .update { margin-bottom: 26px; }
  .uhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-bottom: 6px; margin-bottom: 8px; border-bottom: 1px solid var(--line); }
  .uversion { font-size: 21px; color: var(--head); }
  .change { display: flex; gap: 10px; align-items: flex-start; padding: 4px 0; }
  .change .label { flex: none; min-width: 74px; margin-top: 1px; }
  .table td.wrap { overflow-wrap: anywhere; min-width: 220px; }
  .table.plain td:first-child { width: 220px; color: var(--head); font-weight: 700; }
  .log .error { color: var(--bad); } .log .warn { color: var(--warn); } .log .grab { color: var(--good); }
  progress { width: 110px; height: 10px; accent-color: #7a43b6; vertical-align: middle; }
  /* The small picture of a game in front of its row; a grey square while there is none. */
  .cover { display: block; width: 40px; height: 40px; border-radius: 4px; object-fit: cover; background: var(--mute-bg); }
  .table td.pic { width: 56px; padding-top: 4px; padding-bottom: 4px; }
  /* The overview of the settings: a link and a line per page. */
  .overview button { all: unset; cursor: pointer; display: block; margin-bottom: 26px; }
  .overview button span { display: inline-block; font-size: 26px; font-weight: 300; color: var(--head); border-bottom: 1px solid var(--head); line-height: 1.25; }
  .overview button:hover span { color: var(--link); border-bottom-color: var(--link); }
  .overview button small { display: block; margin-top: 12px; font-size: 14px; color: var(--soft); }
  .overview button:focus-visible { outline: 2px solid var(--link); outline-offset: 4px; }
  /* The cards of the indexers, the download clients and the connections. */
  .cards { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 8px; }
  .pcard { all: unset; box-sizing: border-box; cursor: pointer; width: 290px; min-height: 100px; background: var(--card); box-shadow: var(--shadow);
           border-radius: 3px; padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; }
  .pcard:hover { outline: 1px solid var(--edge); }
  .pcard:focus-visible { outline: 2px solid var(--link); }
  .pcard .name { font-size: 24px; font-weight: 300; color: var(--head); overflow-wrap: anywhere; line-height: 1.3; margin-bottom: auto; }
  .pcard .says { color: var(--soft); font-size: 12px; overflow-wrap: anywhere; }
  .pcard .says.bad { color: var(--bad); }
  .pcard.add { align-items: center; justify-content: center; }
  .pcard.add span { display: flex; align-items: center; justify-content: center; width: 86px; height: 60px; border: 1px solid var(--edge); border-radius: 4px;
                    font-size: 44px; font-weight: 300; line-height: 1; color: var(--head); }
  .pcard.pick { min-height: 86px; width: 250px; align-items: center; text-align: center; }
  .pcard.pick .name { margin: auto 0; }
  .picks { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; padding: 6px 0 14px; }
  /* The window over the page in which one of them is added or changed. */
  #modal { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); display: flex; align-items: flex-start; justify-content: center;
           padding: 5vh 12px 12px; overflow-y: auto; z-index: 20; }
  .dialog.wide { max-width: 1280px; }

  const st = state.status;
  $("sidefoot").textContent = st.running ? "Busy: " + (st.phase || "…")
    : "Last round " + ago(st.last_run) + (st.next_run ? " · next in " + Math.max(0, Math.round((st.next_run - state.now) / 60)) + " min" : "");
  put($("topright"), menu("user", {class: "topbtn", title: "Logged in as " + state.user, "aria-label": "Account"}, icon("person"),
    [["Log out", false, logout]], "Logged in as " + state.user));
}
let lastShown = "", lastRender = 0;
function render() {
  if (!state) return;
  lastRender = Date.now();
  ui = state.ui || ui;
  if (ui.theme === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", ui.theme);
  document.documentElement.toggleAttribute("data-impaired", Boolean(ui.impaired));
  $("version").textContent = "v" + state.version;
  const st = state.status, here = PAGES[page];
  document.title = here.text + " - NSWHunter";
  renderNav(); renderToolbar();
  if (page === "game") renderGamePage();
  const errors = Object.entries(state.services).filter(([name, s]) => !s.ok && name !== "config");
  put($("notice"),
    !state.configured ? h("div", {class: "notice warn"}, "NSWHunter is not set up yet. " + state.missing.join(". ") + ".") : null,
    // A round that broke is said on every page, not only in the events.
    st.error ? h("div", {class: "notice"}, "The last round did not finish (" + ago(st.error.at) + "). " + st.error.text + " System > Events has the details.") : null,
    st.skipped ? h("div", {class: "notice warn"}, "The last round left out " + plural(st.skipped, "game or release", "games or releases") + " because of an error; the rest went on. System > Events says which.") : null,
    ...(state.configured && page !== "status" ? errors.map(([, s]) => h("div", {class: "notice"}, s.name && !s.text.startsWith(s.name) ? s.name + ": " + s.text : s.text)) : []));
  if (SECTION(page) === "wanted") renderWanted();
  if (viewing && !editing) renderGame();
  if (page === "queue") renderQueue();
  if (page === "blocklist") renderBlocklist();
  if (page === "status") renderStatus();
  if (page === "games") renderGames();
  if (page === "backup") renderBackups();
  if (page === "tasks") renderTasks();
  // The cards of a settings page show what the services last said.
  if (here.kind && settings && !editing) renderCards();
}
async function load() {
  if (auth) return;  // the login screen is up: nothing to fetch until it is passed
  try {
    const {data, ok} = await request("/api/state");
    if (!ok) throw new Error();
    const shown = JSON.stringify({...data, now: 0});
    state = data;
    $("app").hidden = false;
    // First visit without settings: go straight to where they are filled in.
    if (!opened) { opened = true; lastShown = shown; show(!state.configured && page === "wanted" ? "connect" : page, gameId, true); return; }
    // Draw again only when something changed, and once a minute for texts like "5 min ago": a page
    // that is drawn again loses the focus of the keyboard and its tooltips.
    if (shown !== lastShown || Date.now() - lastRender > 60000) {
      const changed = shown !== lastShown;
      lastShown = shown; render();
      if (changed && page === "game") loadHistory();  // what was sent or arrived belongs on the page of the game
    }
    if (page === "log") loadLog();
    if (page === "tasks") loadTasks();
  } catch (e) {
    if (e !== LOGIN) { $("app").hidden = false; $("sidefoot").textContent = "No connection to NSWHunter"; }
  }
}
load();
setInterval(load, 8000);
</script>
