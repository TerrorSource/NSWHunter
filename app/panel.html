<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NSWHunter</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='4' fill='%23e4002b'/><path d='M4 8.5l2.5 2.5L12 5.5' stroke='white' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
  :root {
    --bg: #f5f5f3; --card: #ffffff; --line: #e2e1dc; --text: #1d1d1b; --soft: #6b6a65;
    --accent: #e4002b; --accent-text: #ffffff;
    --good: #1a7f4b; --good-bg: #e3f4ea; --warn: #9a6200; --warn-bg: #fbf0d6;
    --info: #1f5fbf; --info-bg: #e4edfb; --bad: #b3261e; --bad-bg: #fbe6e4; --mute-bg: #ecebe7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --card: #1f1f1d; --line: #33322f; --text: #ecebe6; --soft: #9c9a93;
      --accent: #ff4d5e; --accent-text: #1a0508;
      --good: #6fd39b; --good-bg: #173524; --warn: #f0c36a; --warn-bg: #3a2e12;
      --info: #8ab4f8; --info-bg: #1a2a45; --bad: #f2928b; --bad-bg: #40201d; --mute-bg: #2a2a27;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 14px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
  h1 small { font-size: 12px; font-weight: 400; color: var(--soft); margin-left: 6px; }
  .grow { flex: 1; }
  .line { color: var(--soft); font-size: 13px; }
  button { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 7px; cursor: pointer;
           border: 1px solid var(--line); background: var(--card); color: var(--text); }
  button:hover { border-color: var(--soft); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button.quiet { border-color: transparent; background: none; color: var(--soft); padding: 6px 8px; }
  button.quiet:hover { color: var(--text); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .chip, .badge { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 99px;
                  background: var(--mute-bg); color: var(--soft); white-space: nowrap; }
  .chip.ok, .badge.sure { background: var(--good-bg); color: var(--good); }
  .chip.bad, .badge.error { background: var(--bad-bg); color: var(--bad); }
  .badge.likely, .badge.sent { background: var(--info-bg); color: var(--info); }
  .badge.uncertain, .badge.review { background: var(--warn-bg); color: var(--warn); }
  .notice { background: var(--bad-bg); color: var(--bad); border-radius: 9px; padding: 10px 14px; margin-bottom: 14px; overflow-wrap: anywhere; }
  .notice.warn { background: var(--warn-bg); color: var(--warn); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(124px, 1fr)); gap: 10px; margin-bottom: 16px; }
  /* Each tile is a button: it shows only the games that belong to it. */
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px;
          text-align: left; font-size: 15px; }
  .stat b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--soft); font-size: 13px; }
  .stat.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .stat.on span { color: var(--text); }
  .stat.alert b { color: var(--bad); }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; align-items: center; }
  .tabs button.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  .tabs input, .tabs select { font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 7px; border: 1px solid var(--line);
                background: var(--card); color: var(--text); }
  .tabs input { min-width: 160px; }
  .tabs label { color: var(--soft); font-size: 13px; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; }
  .head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 14px; }
  .head > .grow { min-width: 230px; }
  .title { font-weight: 600; }
  .sub { color: var(--soft); font-size: 13px; font-variant-numeric: tabular-nums; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .score { display: inline-flex; align-items: baseline; justify-content: center; min-width: 54px; padding: 3px 9px;
           border-radius: 8px; font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums;
           background: var(--mute-bg); color: var(--soft); }
  .score small { font-weight: 400; font-size: 11px; opacity: .8; margin-left: 1px; }
  .score.high { background: var(--good-bg); color: var(--good); }
  .score.good { background: var(--info-bg); color: var(--info); }
  .score.mid { background: var(--warn-bg); color: var(--warn); }
  .toggle { all: unset; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; flex: 1; min-width: 230px; }
  .toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
  .toggle .arrow { color: var(--soft); width: 14px; flex: none; transition: transform .12s; margin-top: 2px; }
  .toggle[aria-expanded=true] .arrow { transform: rotate(90deg); }
  .toggle:hover .title { text-decoration: underline; }
  .cands { border-top: 1px solid var(--line); }
  .cand { display: grid; grid-template-columns: 64px 1fr auto; gap: 4px 12px; padding: 9px 14px; align-items: start; }
  .cand + .cand { border-top: 1px solid var(--line); }
  .cand.first { background: color-mix(in srgb, var(--good-bg) 35%, transparent); }
  .cand .name { overflow-wrap: anywhere; }
  .cand.fell { grid-template-columns: 96px 1fr auto; opacity: .85; }
  .rest button.quiet { padding: 2px 4px; }
  .cand a { color: inherit; }
  .cand .acts { display: flex; gap: 4px; align-items: center; }
  .part { border-top: 1px solid var(--line); padding: 8px 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
          background: color-mix(in srgb, var(--mute-bg) 45%, transparent); }
  .part b { font-weight: 600; }
  .rest { border-top: 1px solid var(--line); padding: 9px 14px; color: var(--soft); font-size: 13px; }
  .more { color: var(--soft); font-size: 13px; overflow-wrap: anywhere; font-weight: 400; }
  .confirm { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; }
  .authcard { max-width: 380px; margin: 8vh auto 0; background: var(--card); border: 1px solid var(--line);
              border-radius: 12px; padding: 24px; display: grid; gap: 8px; }
  .authcard h2 { font-size: 17px; margin: 6px 0 0; }
  .authcard p { margin: 0 0 6px; }
  .authcard label { color: var(--soft); font-size: 14px; margin-top: 6px; display: block; }
  .authcard input { font: inherit; width: 100%; padding: 8px 10px; border-radius: 7px; border: 1px solid var(--line);
                    background: var(--bg); color: var(--text); }
  .authcard input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .authcard button { margin-top: 10px; padding: 9px 12px; font-size: 15px; }
  .authcard .testresult:empty { display: none; }
  .sent-row { border-top: 1px solid var(--line); padding: 9px 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .empty { color: var(--soft); text-align: center; padding: 40px 0; }
  .log { font-size: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 4px 14px; }
  .log div { padding: 6px 0; border-bottom: 1px solid var(--line); display: flex; gap: 12px; }
  .log div:last-child { border-bottom: none; }
  .log time { color: var(--soft); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .log .error { color: var(--bad); } .log .warn { color: var(--warn); } .log .grab { color: var(--good); }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text); color: var(--bg);
           padding: 9px 16px; border-radius: 9px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
  #toast.show { opacity: 1; }
  .views { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  .views button { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: none;
                  font-size: 15px; padding: 8px 14px; color: var(--soft); }
  .views button.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  fieldset { background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin: 0 0 12px; padding: 14px 16px 6px; }
  legend { font-weight: 600; padding: 0 6px; }
  .field { display: grid; grid-template-columns: 190px 1fr; gap: 4px 14px; align-items: center; margin-bottom: 12px; }
  .field label { color: var(--soft); font-size: 14px; }
  .field .help { grid-column: 2; color: var(--soft); font-size: 13px; }
  .field .row { display: flex; gap: 6px; align-items: center; }
  .field input[type=text], .field input[type=url], .field input[type=password], .field select {
    font: inherit; width: 100%; padding: 7px 10px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); }
  .field input:focus, .field select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .field input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
  .testresult { font-size: 14px; } .testresult.ok { color: var(--good); } .testresult.bad { color: var(--bad); }
  .savebar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
  .results { margin-top: 12px; display: grid; gap: 6px; }
  .results div { padding: 8px 12px; border-radius: 8px; background: var(--good-bg); color: var(--good); font-size: 14px; }
  .results div.bad { background: var(--bad-bg); color: var(--bad); }
  @media (max-width: 640px) { #shown { flex-basis: 100%; } .cand { grid-template-columns: 1fr; } .field { grid-template-columns: 1fr; } .field .help { grid-column: 1; } }
</style>
</head>
<body>
<main>
  <div id="app" hidden>
    <header>
      <h1>NSWHunter <small id="version"></small></h1>
      <span class="line grow" id="statusline">Loading…</span>
      <button class="primary" id="sync">Sync now</button>
      <button class="quiet" id="logout" title="Log out of the panel in this browser">Log out</button>
    </header>
    <nav class="views" id="views"></nav>
    <div id="notice"></div>
    <section id="view-updates">
      <div class="stats" id="stats"></div>
      <div class="tabs" id="tools"></div>
      <div id="list"></div>
    </section>
    <section id="view-log" hidden>
      <div class="tabs" id="logtools"></div>
      <div class="log" id="log"></div>
      <div class="empty" id="logmore"></div>
    </section>
    <section id="view-config" hidden>
      <div class="chips" id="chips"></div>
      <form id="config" autocomplete="off"></form>
    </section>
  </div>
  <section id="auth" hidden>
    <form id="authform" class="authcard">
      <h1>NSWHunter</h1>
      <h2 id="authtitle">Log in</h2>
      <p class="line" id="authtext"></p>
      <label for="auth-user">Username</label>
      <input id="auth-user" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <label for="auth-password">Password</label>
      <input id="auth-password" type="password" autocomplete="current-password" required>
      <div id="auth-repeat-row" hidden>
        <label for="auth-repeat">Password again</label>
        <input id="auth-repeat" type="password" autocomplete="new-password">
      </div>
      <div class="testresult bad" id="autherror" role="alert"></div>
      <button class="primary" type="submit" id="authgo">Log in</button>
    </form>
  </section>
</main>
<div id="toast"></div>
<script>
// Release names come from indexers: everything is put on the page as text, never as HTML.
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) if (c !== null && c !== undefined && c !== false) el.append(c);
  return el;
}
const $ = id => document.getElementById(id);
function put(el, ...children) {
  el.replaceChildren(...children.flat().filter(c => c !== null && c !== undefined && c !== false));
}
// The choice is kept in this browser; without storage it is simply the default again.
function remembered(key, fallback) {
  try { return localStorage.getItem("nswhunter-" + key) || fallback; } catch (e) { return fallback; }
}
function remember(key, value) {
  try { localStorage.setItem("nswhunter-" + key, value); } catch (e) { /* private window */ }
}
let state = null, needle = "", busy = new Set(), expanded = new Set(), fallen = new Set(), thrown = new Set();
let view = "updates", settings = null, clearing = new Set(), opened = false, tests = {}, confirming = false;
let only = remembered("only", "choice"), sortBy = remembered("sort", "score"), flipped = remembered("flipped", "") === "1";
let auth = null;  // "login" or "setup" while the login screen is up
let events = null, logLevel = remembered("loglevel", "all"), logNeedle = "", logShown = 100;
const BULK = 9;  // "Download all" takes the best release of a game from this score on

// Every call to the server. Without a login the server says so, and the login screen comes up.
const LOGIN = new Error("login");
async function request(path, body) {
  const options = body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)};
  const r = await fetch(path, options);
  const data = await r.json().catch(() => ({ok: false, error: "HTTP " + r.status}));
  if (r.status === 401 && data.login) { needLogin(data.setup); throw LOGIN; }
  return {status: r.status, ok: r.ok, data};
}

// ---------------------------------------------------------------- logging in
function needLogin(setup) {
  const mode = setup ? "setup" : "login";
  if (auth === mode) return;
  auth = mode;
  $("app").hidden = true; $("auth").hidden = false;
  $("authtitle").textContent = setup ? "Make your login" : "Log in";
  $("authtext").textContent = setup
    ? "The panel holds the keys of your services, so it needs a login. Choose a username and a password of at least 8 characters."
    : "";
  $("auth-repeat-row").hidden = !setup;
  $("auth-password").setAttribute("autocomplete", setup ? "new-password" : "current-password");
  $("authgo").textContent = setup ? "Make login" : "Log in";
  $("autherror").textContent = "";
  $("auth-password").value = ""; $("auth-repeat").value = "";
  $("auth-user").focus();
}
$("authform").addEventListener("submit", async e => {
  e.preventDefault();
  const user = $("auth-user").value.trim(), password = $("auth-password").value;
  const say = text => { $("autherror").textContent = text; };
  if (auth === "setup" && password.length < 8) return say("Use at least 8 characters for the password.");
  if (auth === "setup" && password !== $("auth-repeat").value) return say("The two passwords are not the same.");
  $("authgo").disabled = true; say("");
  try {
    const r = await fetch(auth === "setup" ? "/api/setup" : "/api/login", {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({user, password})});
    const data = await r.json().catch(() => ({ok: false, error: "HTTP " + r.status}));
    if (!data.ok) { say(data.error || "Failed"); $("auth-password").select(); return; }
    auth = null; opened = false;
    $("auth").hidden = true; $("app").hidden = false;
    $("auth-password").value = ""; $("auth-repeat").value = "";
    await load();
  } catch (err) {
    say("No connection to NSWHunter");
  } finally {
    $("authgo").disabled = false;
  }
});
$("logout").addEventListener("click", async () => {
  try { await request("/api/logout", {}); } catch (e) { /* the screen below comes up either way */ }
  state = null;
  needLogin(false);
});

// The score is the chance that a download is the right one, from 1 to 10.
function score(value, title) {
  const level = value >= 9 ? "high" : value >= 7 ? "good" : value >= 4 ? "mid" : "";
  return h("span", {class: "score " + level, title: title || "The chance that this download is the right one"}, String(value || "?"), h("small", {}, "/10"));
}
const KIND = {update: "update", bundle: "bundle", dlc: "DLC", dlcpack: "DLC pack", unknown: ""};
const SERVICES = {slm: "Library", prowlarr: "Prowlarr", downloader: "Download client", titledb: "Version list", telegram: "Telegram", config: "Settings"};
// How a sent release is doing, as the download client tells it.
const SENT = {sent: "added to queue", downloading: "downloading", done: "downloaded, waiting for the library",
              stuck: "downloaded, but not seen in your library"};
function sentText(grab) {
  const percent = grab.state === "downloading" && grab.percent !== null && grab.percent !== undefined ? " " + grab.percent + "%" : "";
  return (SENT[grab.state] || SENT.sent) + percent;
}
function autoText(min) { return min ? "from score " + min : "off: everything awaits your choice"; }
function plural(n, one, many) { return n + " " + (n === 1 ? one : many || one + "s"); }

function toast(text) {
  const t = $("toast"); t.textContent = text; t.classList.add("show");
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("show"), 4000);
}
function ago(ts) {
  if (!ts) return "never";
  const s = Math.max(0, state.now - ts);
  if (s < 90) return "just now";
  if (s < 5400) return Math.round(s / 60) + " min ago";
  if (s < 129600) return plural(Math.round(s / 3600), "hour") + " ago";
  return plural(Math.round(s / 86400), "day") + " ago";
}
function moment(ts) { return new Date(ts * 1000).toLocaleString(undefined, {dateStyle: "short", timeStyle: "short"}); }
function size(bytes) {
  if (!bytes) return "";
  return bytes >= 1073741824 ? (bytes / 1073741824).toFixed(1) + " GB" : Math.round(bytes / 1048576) + " MB";
}
function day(iso) { return iso ? iso.slice(0, 10) : ""; }
// One card per game: its missing update and all its missing DLC together.
function games() {
  const byGame = new Map();
  for (const item of state.items) {
    if (!byGame.has(item.game_id)) byGame.set(item.game_id, {id: item.game_id, name: item.name, items: []});
    byGame.get(item.game_id).items.push(item);
  }
  const value = SORTS[sortBy] || SORTS.score, way = (value.down ? -1 : 1) * (flipped ? -1 : 1);
  const byName = (a, b) => a.name.localeCompare(b.name, undefined, {sensitivity: "base"});
  return [...byGame.values()].sort((a, b) => {
    const x = value.of(a), y = value.of(b);
    return (typeof x === "string" ? x.localeCompare(y, undefined, {sensitivity: "base"}) : x - y) * way || byName(a, b);
  });
}

// What the overview can be sorted on. `down`: the natural order is highest first.
const releases = g => g.items.filter(i => !i.ignored).flatMap(i => i.candidates);
const SORTS = {
  score: {text: "Score", down: true, of: g => Math.max(0, ...releases(g).map(c => c.score || 0))},
  name: {text: "Name", down: false, of: g => g.name},
  newest: {text: "Newest release", down: true, of: g => Math.max(0, ...releases(g).map(c => Date.parse(c.published) || 0))},
  count: {text: "Number of releases", down: true, of: g => releases(g).length},
  behind: {text: "Updates behind", down: true, of: g => {
    const u = g.items.find(i => i.type === "update");
    return u ? Math.round((u.latest_version - u.local_version) / 65536) : 0; }},
  missing: {text: "Missing DLC", down: true, of: g => g.items.filter(i => i.type === "dlc").length},
  searched: {text: "Last searched", down: true, of: g => Math.max(0, ...g.items.map(i => i.last_search || 0))},
};

// The tiles at the top. A click on one shows only the games that belong to it.
// has: does a game belong to it; number: what the tile counts, if not those games.
const live = g => g.items.filter(i => !i.ignored);
const failed = g => g.items.flatMap(i => i.failed || []);
const waiting = i => i.status === "review";
const TILES = {
  all: {text: "games in your library", has: () => true, number: () => state.library.games,
        none: "Your library misses no updates. Or the first round is still running."},
  updates: {text: "updates missing", has: g => g.items.some(i => i.type === "update"),
            none: "No game misses an update."},
  dlc: {text: "DLC missing", has: g => g.items.some(i => i.type === "dlc"), number: () => state.library.dlc,
        none: "No game misses DLC."},
  choice: {text: "awaiting your choice", has: g => g.items.some(waiting),
           none: "Nothing awaits your choice. Releases that are found show up here."},
  queue: {text: "added to queue", has: g => live(g).some(i => i.grab),
          none: "Nothing is in the queue of the download client."},
  failed: {text: "download failed", has: g => failed(g).length > 0,
           none: "No download failed."},
  // Not games but releases: what was sent and is now in the library.
  arrived: {text: "arrived", has: () => false, number: () => state.arrived.length,
            none: "Nothing that was sent has arrived in the last 30 days."},
  ignored: {text: "ignored", has: g => g.items.some(i => i.ignored), none: "You ignore no games."},
};
function tiles(all) {
  const count = key => all.filter(TILES[key].has).length;
  return Object.keys(TILES).filter(key =>
    (key !== "dlc" || state.settings.dlc) && (key !== "ignored" || count(key) > 0 || only === key));
}
// What "Download all" would send: the best release of every waiting item, if it scores high enough.
function ready() {
  return state.items.filter(i => waiting(i) && (i.candidates[0].score || 0) >= BULK && i.candidates[0].kind !== "bundle");
}

async function post(path, body, key) {
  busy.add(key); render();
  try {
    const {data} = await request(path, body);
    if (!data.ok) toast(data.error || "Failed");
    return data;
  } catch (e) {
    if (e !== LOGIN) toast("No connection to NSWHunter");
    return {ok: false};
  } finally {
    busy.delete(key); await load();
  }
}
function grab(item, release) {
  return post("/api/grab", {key: item.key, guid: release.guid}, release.guid).then(d => d.ok && toast("Added to the queue of the download client"));
}

// Nintendo numbers updates in steps of 65536: v720896 is update 11.
function upd(version) {
  if (!version) return "no update";
  return version % 65536 === 0 ? "update " + version / 65536 : "v" + version;
}
function versions(item) {
  if (item.type === "dlc") return "DLC: " + (item.dlc_name || item.dlc_id);
  const local = upd(item.local_version) + (item.local_display ? " (v" + item.local_display + ")" : "");
  return "you have " + local + " → latest is " + upd(item.latest_version) + (item.latest_date ? " of " + item.latest_date : "");
}
function link(release) {
  const safe = /^https?:\/\//.test(release.infoUrl || "");
  return safe ? h("a", {href: release.infoUrl, target: "_blank", rel: "noopener noreferrer"}, release.title) : release.title;
}
// A list that opens on a click: "▸ 3 releases ruled out".
function fold(open, text, toggle) {
  return h("div", {class: "rest"},
    h("button", {class: "quiet", "aria-expanded": open ? "true" : "false", onclick: toggle}, (open ? "▾ " : "▸ ") + text));
}

function candidate(item, c, first) {
  const version = [c.display_version ? "v" + c.display_version : null,
    c.internal_version != null ? upd(c.internal_version) + " (v" + c.internal_version + ")" : null,
    c.estimated_version ? (c.deduced ? "" : "probably ") + upd(c.estimated_version) : null].filter(Boolean).join(" · ");
  const meta = [version, KIND[c.kind], size(c.size), c.indexer, day(c.published)].filter(Boolean).join(" · ");
  const sent = (item.sent || []).includes(c.guid);
  return h("div", {class: "cand" + (first ? " first" : "")},
    h("div", {}, score(c.score),
      c.guid === item.auto_guid ? h("div", {class: "sub", title: "Goes to the download client by itself in the next round"}, "automatic") : null),
    h("div", {},
      h("div", {class: "name"}, link(c)),
      h("div", {class: "sub"}, meta),
      h("div", {class: "sub"}, c.reasons.join("; "))),
    h("div", {class: "acts"},
      sent ? h("span", {class: "badge sent"}, "sent") : null,
      h("button", {class: first && !sent ? "primary" : "", disabled: busy.has(c.guid), onclick: () => grab(item, c)},
        sent ? "Send again" : "Download"),
      h("button", {class: "quiet", title: "Do not show this release again. It can be restored below the list.",
                   onclick: () => post("/api/block", {key: item.key, guid: c.guid}, c.guid)}, "Reject")));
}
// A release that is not a candidate: ruled out, or rejected by hand.
function aside(release, badge, why, button) {
  return h("div", {class: "cand fell"},
    h("div", {}, h("span", {class: "badge"}, badge)),
    h("div", {},
      h("div", {class: "name"}, link(release)),
      h("div", {class: "sub"}, [size(release.size), release.indexer, day(release.published)].filter(Boolean).join(" · ")),
      why ? h("div", {class: "sub"}, why) : null),
    h("div", {class: "acts"}, button));
}

// One missing thing of a game (the update, or one DLC) with its releases.
function part(item) {
  const what = item.type === "dlc" ? "DLC: " + (item.dlc_name || item.dlc_id)
    : item.type === "dlcpack" ? "DLC pack (for all missing DLC of this game)" : "Update";
  const rows = [h("div", {class: "part"},
    h("span", {class: "grow"}, h("b", {}, what),
      item.type === "update" && item.ladder && item.ladder.length > 1
        ? h("span", {class: "sub", title: "Which version in release names is which update"},
            "  " + item.ladder.map(r => "v" + r.display + " = " + r.update + (r.how === "date" ? " (by date)" : "")).join(" · ")) : null),
    item.asked ? h("span", {class: "badge", title: "The best release was put to you in Telegram, with buttons to decide there"}, "asked in Telegram") : null,
    item.ignored ? h("span", {class: "badge"}, "ignored") : null,
    h("button", {class: "quiet", onclick: () => post("/api/ignore", {key: item.key, ignored: !item.ignored}, "i" + item.key)},
      item.ignored ? "Stop ignoring" : "Ignore"))];
  if (item.grab) {
    rows.push(h("div", {class: "sent-row"},
      h("span", {class: "badge " + (item.grab.state === "stuck" ? "review" : "sent")},
        (item.grab.auto ? "automatically " : "") + sentText(item.grab)),
      h("span", {class: "grow"}, item.grab.title, h("span", {class: "sub"}, " · " + ago(item.grab.at))),
      h("button", {class: "quiet", title: "Forget that this was sent, so it awaits your choice again",
                   onclick: () => post("/api/unsend", {key: item.key}, "u" + item.key)}, "Not sent")));
  }
  // Downloads that failed, as the download client reported them.
  for (const f of item.failed || []) {
    rows.push(h("div", {class: "sent-row"},
      h("span", {class: "badge error"}, "download failed"),
      h("span", {class: "grow"}, f.title, h("span", {class: "sub"}, " · " + f.why + " · " + ago(f.failed_at))),
      h("button", {disabled: busy.has(f.guid), title: "Send this release to the download client once more",
                   onclick: () => grab(item, f)}, "Try again"),
      h("button", {class: "quiet", title: "Take this off the list of failed downloads. The release stays rejected.",
                   onclick: () => post("/api/dismiss", {key: item.key, guid: f.guid}, "d" + f.guid)}, "Dismiss")));
  }
  // The other releases stay in view after one was sent: another can still be chosen.
  if (!item.ignored) rows.push(...item.candidates.map((c, i) => candidate(item, c, i === 0 && !item.grab)));
  if (item.ignored) return rows;
  // What was ruled out, and why: to see that nothing good was thrown away, and to overrule it.
  const rejected = item.rejected || [];
  if (rejected.length) {
    const open = fallen.has(item.key);
    rows.push(fold(open, plural(rejected.length, "release") + " ruled out",
      () => { open ? fallen.delete(item.key) : fallen.add(item.key); renderList(); }));
    if (open) rows.push(...rejected.map(r => aside(r, "ruled out", r.reason,
      h("button", {disabled: busy.has(r.guid), title: "Send this release to the download client after all",
                   onclick: () => grab(item, r)}, "Download anyway"))));
  }
  // What you rejected yourself: it can be taken back.
  const down = item.turned_down || [], count = down.length + (item.unnamed || 0);
  if (count) {
    const open = thrown.has(item.key);
    rows.push(fold(open, plural(count, "release") + " you rejected",
      () => { open ? thrown.delete(item.key) : thrown.add(item.key); renderList(); }));
    if (open) {
      rows.push(...down.map(r => aside(r, "rejected", "",
        h("button", {disabled: busy.has(r.guid), title: "Put this release back in the list",
                     onclick: () => post("/api/restore", {key: item.key, guid: r.guid}, r.guid)}, "Restore"))));
      if (item.unnamed) rows.push(h("div", {class: "sent-row"},
        h("span", {class: "grow sub"}, plural(item.unnamed, "release") + " rejected before their names were kept. Restored, they return at the next search."),
        h("button", {disabled: busy.has("r" + item.key), onclick: () => post("/api/restore", {key: item.key}, "r" + item.key)}, "Restore all")));
    }
  }
  return rows;
}

function gameCard(game) {
  const update = game.items.find(i => i.type === "update"), dlc = game.items.filter(i => i.type === "dlc");
  const review = live(game).filter(i => i.status === "review"), sent = live(game).filter(i => i.grab);
  const count = review.reduce((n, i) => n + i.candidates.length, 0);
  // The best release of the game: the one a click on Download on the card sends.
  // Of equal scores the update goes before DLC.
  const rank = t => (t.release.score || 0) * 2 + (t.item.type === "update" ? 1 : 0);
  const top = review.map(i => ({item: i, release: i.candidates[0]})).sort((a, b) => rank(b) - rank(a))[0];
  const something = i => i.candidates.length || i.grab || (i.rejected || []).length || (i.failed || []).length
    || (i.turned_down || []).length || i.unnamed;
  const withSomething = game.items.filter(something);
  const empty = game.items.filter(i => !something(i) && i.type !== "dlcpack");
  const can = withSomething.length > 0 || game.items.length > 1, shown = can && expanded.has(game.id);
  const searched = Math.max(0, ...game.items.map(i => i.last_search || 0));
  const searching = busy.has("s" + game.id), allIgnored = game.items.every(i => i.ignored);
  const label = allIgnored ? ["ignored", "ignored"] : sent.length ? ["sent", "in queue"]
    : game.items.some(i => i.status === "none") ? ["none", "nothing found"] : ["new", "not searched yet"];
  // Named on the card, so it need not be opened: what is in the queue, what failed, or the best release.
  const more = only === "queue" ? sent.map(i => sentText(i.grab) + ": " + i.grab.title)
    : only === "failed" ? failed(game).map(f => "failed " + ago(f.failed_at) + ": " + f.title)
    : top ? ["best: " + top.release.title] : [];
  const names = h("div", {},
    h("div", {class: "title"}, game.name),
    h("div", {class: "sub"}, h("span", {class: "mono"}, game.id),
      update ? " · " + versions(update) : "",
      dlc.length ? " · " + dlc.length + " DLC missing" : "",
      searched ? " · searched " + ago(searched) : ""),
    more.map(text => h("div", {class: "more"}, text)));
  const card = h("div", {class: "item"},
    h("div", {class: "head"},
      // Collapsed by default: a click on the name shows what is missing and the releases.
      can ? h("button", {class: "toggle", "aria-expanded": shown ? "true" : "false",
                         onclick: () => { shown ? expanded.delete(game.id) : expanded.add(game.id); renderList(); }},
              h("span", {class: "arrow"}, "▸"), names)
          : h("div", {class: "grow"}, names),
      count ? h("span", {class: "sub"}, plural(count, "release")) : null,
      failed(game).length ? h("span", {class: "badge error"}, failed(game).length + " failed") : null,
      sent.length && count ? h("span", {class: "badge sent"}, sent.length + " in queue") : null,
      top ? score(top.release.score, "Score of the best release that was found") : h("span", {class: "badge " + label[0]}, label[1]),
      top ? h("button", {class: "primary", disabled: busy.has(top.release.guid),
                         title: "Send the best release to the download client: " + top.release.title,
                         onclick: () => grab(top.item, top.release)}, "Download") : null,
      h("button", {disabled: searching,
                   onclick: () => post("/api/search", {key: game.items[0].key}, "s" + game.id).then(d => d.ok && toast(d.found ? plural(d.found, "new candidate release") : "Nothing new found"))},
        searching ? "Searching…" : "Search now"),
      h("button", {class: "quiet", title: "Ignore everything of this game",
                   onclick: () => post("/api/ignore", {keys: game.items.map(i => i.key), ignored: !allIgnored}, "i" + game.id)},
        allIgnored ? "Stop ignoring" : "Ignore")));
  if (shown) {
    const first = i => (i.type === "update" ? 0 : 1) * 100 - Math.max(0, ...i.candidates.map(c => c.score || 0));
    for (const item of withSomething.sort((a, b) => first(a) - first(b))) card.append(...part(item));
    if (empty.length) {
      card.append(h("div", {class: "rest"}, "Nothing found yet for: " +
        empty.map(i => i.type === "dlc" ? (i.dlc_name || i.dlc_id) : "the update").join(" · ")));
    }
  }
  return card;
}

function render() {
  if (!state) return;
  $("version").textContent = "v" + state.version;
  const st = state.status;
  $("statusline").textContent = st.running ? "Busy: " + (st.phase || "…")
    : "Last round " + ago(st.last_run) + (st.next_run ? " · next in " + Math.max(0, Math.round((st.next_run - state.now) / 60)) + " min" : "");
  $("sync").disabled = st.running || !state.configured;
  put($("views"), ...[["updates", "Updates"], ["log", "Log"], ["config", "Configuration"]].map(([name, text]) =>
    h("button", {class: view === name ? "on" : "", onclick: () => show(name)}, text)));

  // The checks of the services: on the Configuration tab only.
  put($("chips"), ...Object.entries(state.services).filter(([n]) => n !== "config").map(([name, s]) =>
    h("span", {class: "chip " + (s.ok ? "ok" : "bad"), title: s.text}, (s.ok ? "✓ " : "✕ ") + (SERVICES[name] || name))),
    h("span", {class: "chip"}, "Automatic download " + autoText(state.settings.auto)),
    h("span", {class: "chip"}, "DLC " + (state.settings.dlc ? "on" : "off")),
    h("span", {class: "chip"}, "Searches every " + state.settings.search_hours + " hours"));
  const errors = Object.entries(state.services).filter(([name, s]) => !s.ok && name !== "config");
  put($("notice"),
    !state.configured && view !== "config" ? h("div", {class: "notice"}, "NSWHunter is not set up yet. Fill in the Configuration tab.") : null,
    // A round that broke is said on every page, not only in the log.
    st.error ? h("div", {class: "notice"}, "The last round did not finish (" + ago(st.error.at) + "). " + st.error.text + " The Log tab has the details.") : null,
    st.skipped ? h("div", {class: "notice warn"}, "The last round left out " + plural(st.skipped, "game or release", "games or releases") + " because of an error; the rest went on. The Log tab says which.") : null,
    ...(state.configured ? errors.map(([, s]) => h("div", {class: "notice"}, s.text)) : []));

  const all = games(), keys = tiles(all);
  if (!keys.includes(only)) only = "choice";
  put($("stats"), ...keys.map(key => {
    const tile = TILES[key], number = tile.number ? tile.number() : all.filter(tile.has).length;
    return h("button", {class: "stat" + (only === key ? " on" : "") + (key === "failed" && number ? " alert" : ""),
                        "aria-pressed": only === key ? "true" : "false", title: "Show only these",
                        onclick: () => { only = key; confirming = false; remember("only", key); render(); }},
      h("b", {}, number), h("span", {}, tile.text));
  }));

  const n = ready().length;
  put($("tools"),
    h("span", {class: "line grow", id: "shown"}),
    // Many games waiting: send the best release of each in one go. Asked once more, in the page.
    only === "choice" && n && !confirming ? h("button", {
      title: "The best release of every game, if its score is " + BULK + " or 10. Bundles are left for a click of their own.",
      onclick: () => { confirming = true; render(); }}, "Download all " + n + " with score " + BULK + "+") : null,
    only === "choice" && n && confirming ? h("span", {class: "confirm"},
      h("span", {}, "Send " + plural(n, "release") + " to the download client?"),
      h("button", {class: "primary", disabled: busy.has("bulk"), onclick: () => {
        confirming = false;
        post("/api/grab-best", {min_score: BULK}, "bulk").then(d => d.ok && toast(plural(d.sent, "release") + " added to the queue"));
      }}, "Yes, send"),
      h("button", {onclick: () => { confirming = false; render(); }}, "Cancel")) : null,
    h("label", {for: "sort"}, "Sort by"),
    h("select", {id: "sort", onchange: e => { sortBy = e.target.value; flipped = false; remember("sort", sortBy); remember("flipped", ""); render(); }},
      Object.entries(SORTS).map(([key, v]) => h("option", {value: key, selected: key === sortBy}, v.text))),
    h("button", {id: "flip", title: "Reverse the order",
                 "aria-label": "Reverse the order, now " + ((SORTS[sortBy] || SORTS.score).down !== flipped ? "descending" : "ascending"),
                 onclick: () => { flipped = !flipped; remember("flipped", flipped ? "1" : ""); render(); }},
      (SORTS[sortBy] || SORTS.score).down !== flipped ? "↓" : "↑"),
    h("input", {type: "search", placeholder: "Filter by name", value: needle, id: "filter",
                oninput: e => { needle = e.target.value; renderList(); }}));
  renderList();
}

function renderList() {
  const tile = TILES[only] || TILES.choice, word = needle.trim().toLowerCase();
  if (only === "arrived") {
    const mine = state.arrived, rows = mine.filter(a => !word || (a.name + " " + a.title).toLowerCase().includes(word));
    $("shown").textContent = (word ? rows.length + " of " : "") + plural(mine.length, "release") + " arrived in the last 30 days";
    put($("list"), rows.length ? h("div", {class: "log"}, rows.map(a =>
      h("div", {}, h("time", {}, moment(a.at)),
        h("span", {}, h("b", {}, a.name), " · " + a.what + (a.auto ? " · sent automatically" : ""),
          h("div", {class: "more"}, a.title + (a.note ? " · " + a.note : ""))))))
      : h("div", {class: "empty"}, word && mine.length ? "Nothing with that name in this list." : tile.none));
    return;
  }
  const mine = games().filter(tile.has);
  const items = mine.filter(g => !word || g.name.toLowerCase().includes(word) || g.id.toLowerCase().includes(word));
  // The library tile counts every game; the list holds the ones that miss something.
  const what = only === "all" ? " that miss an update" + (state.settings.dlc ? " or DLC" : "") : " · " + tile.text;
  $("shown").textContent = (word ? items.length + " of " : "") + plural(mine.length, "game") + what;
  put($("list"), ...(items.length ? items.map(gameCard) : [h("div", {class: "empty"}, word && mine.length ? "No game with that name in this list." : tile.none)]));
}

// ---------------------------------------------------------------- Log
const LEVELS = {all: "Everything", warn: "Warnings and errors", error: "Errors only"};
async function loadLog() {
  try {
    const {data} = await request("/api/log");
    events = data.events || [];
    renderLog();
  } catch (e) {
    if (e !== LOGIN) toast("Could not load the log");
  }
}
// The tools are built once, so typing in the search box is not interrupted by a refresh.
function renderLogTools() {
  put($("logtools"),
    h("span", {class: "line grow", id: "logcount"}),
    h("label", {for: "loglevel"}, "Show"),
    h("select", {id: "loglevel", onchange: e => { logLevel = e.target.value; logShown = 100; remember("loglevel", logLevel); renderLog(); }},
      Object.entries(LEVELS).map(([key, text]) => h("option", {value: key, selected: key === logLevel}, text))),
    h("input", {type: "search", placeholder: "Search the log", value: logNeedle, id: "logfilter",
                oninput: e => { logNeedle = e.target.value; logShown = 100; renderLog(); }}));
}
function renderLog() {
  if (!events) return;
  const word = logNeedle.trim().toLowerCase();
  const rows = events.filter(e => (logLevel === "all" || e.level === "error" || (logLevel === "warn" && e.level === "warn"))
    && (!word || e.text.toLowerCase().includes(word)));
  $("logcount").textContent = rows.length === events.length ? plural(events.length, "line") : rows.length + " of " + plural(events.length, "line");
  put($("log"), rows.length ? rows.slice(0, logShown).map(e =>
    h("div", {class: e.level}, h("time", {}, moment(e.at)), h("span", {}, e.text)))
    : h("div", {class: "line"}, events.length ? "No line in the log matches." : "Nothing happened yet."));
  put($("logmore"), rows.length > logShown
    ? h("button", {onclick: () => { logShown += 200; renderLog(); }}, "Show " + Math.min(200, rows.length - logShown) + " more") : null);
}

    {name: "PANEL_USER", label: "Username"},
    {name: "PANEL_PASSWORD", label: "Password", secret: true, required: true,
     help: "At least 8 characters; only a hash of it is kept. After a change every other browser has to log in again."},
    {name: "PANEL_HOSTS", label: "Host names", placeholder: "nswhunter.example.com",
     help: "Only needed if you open the panel by a domain name, behind a reverse proxy for example: fill in that name, several separated by commas. An IP address and a name inside your home network (nas, nas.local) always work. Other names are refused, so a website cannot reach the panel through your browser."}]},
];

function fieldRow(f, client) {
  const id = "f-" + f.name, hidden = (f.only && f.only !== client) || (f.unless && f.unless === client);
  let control;
  if (f.options) {
    control = h("select", {id, name: f.name, onchange: f.name === "DOWNLOAD_CLIENT" ? e => renderConfig(e.target.value) : null},
      f.options.map(([value, text]) => h("option", {value, selected: String(settings.values[f.name]) === value}, text)));
  } else if (f.checkbox) {
    control = h("input", {id, name: f.name, type: "checkbox", checked: settings.values[f.name] === true});
  } else if (f.secret) {
    const set = settings.secrets[f.name], wipe = clearing.has(f.name);
    control = h("div", {class: "row"},
      h("input", {id, name: f.name, type: "password", autocomplete: "new-password", disabled: wipe,
                  placeholder: wipe ? "will be cleared on save" : set ? "set; leave empty to keep it" : "not set"}),
      // A key can be emptied; the password of the panel can only be replaced.
      set && !f.required ? h("button", {type: "button", class: "quiet", onclick: () => { wipe ? clearing.delete(f.name) : clearing.add(f.name); renderConfig(); }},
        wipe ? "Keep it" : "Clear") : null);
  } else {
    control = h("input", {id, name: f.name, type: "text", value: settings.values[f.name] || "", placeholder: f.placeholder || "", spellcheck: "false"});
  }
  return h("div", {class: "field", hidden},
    h("label", {for: id}, f.label), control, f.help ? h("div", {class: "help"}, f.help) : null);
}

// A Test button tries one service with what is in the form now, saved or not.
function testRow(service, text) {
  const t = tests[service];
  return h("div", {class: "field"}, h("span", {}),
    h("div", {class: "row"},
      h("button", {type: "button", disabled: t && t.busy, onclick: () => runTest(service)}, t && t.busy ? "Busy…" : (text || "Test")),
      t && !t.busy ? h("span", {class: "testresult " + (t.ok ? "ok" : "bad")}, (t.ok ? "✓ " : "✕ ") + t.text) : null));
}
async function runTest(service) {
  const values = typed();
  tests[service] = {busy: true}; renderConfig();
  try {
    const {data} = await request("/api/test", {service, values, clear: [...clearing]});
    tests[service] = {ok: data.ok === true, text: data.text || "Failed"};
  } catch (e) {
    tests[service] = {ok: false, text: e === LOGIN ? "Log in first" : "No connection to NSWHunter"};
  }
  if (!auth) renderConfig();
}

// Typed but not yet saved values survive a rebuild of the form (switching client, "Clear").
function typed() {
  const values = {};
  for (const el of $("config").elements) {
    if (!el.name) continue;
    values[el.name] = el.type === "checkbox" ? el.checked : el.value;
  }
  return values;
}

function renderConfig(client) {
  const keep = typed();
  for (const [name, value] of Object.entries(keep)) if (name in settings.values) settings.values[name] = value;
  if (client) settings.values.DOWNLOAD_CLIENT = client;
  put($("config"),
    ...GROUPS.map(g => h("fieldset", {}, h("legend", {}, g.title),
      g.fields.map(f => fieldRow(f, settings.values.DOWNLOAD_CLIENT)),
      g.test ? testRow(g.test, g.testText) : null)),
    h("div", {class: "savebar"},
      h("button", {class: "primary", type: "submit", id: "save"}, "Save and test the connections"),
      h("span", {class: "line"}, "Saved settings are kept in /data/settings.json and take precedence over the values in your compose file. A key or password is only sent to the address it was saved for: change an address, and you fill in its key again.")),
    h("div", {class: "results", id: "results"}));
  for (const [name, value] of Object.entries(keep)) {
    const el = $("config").elements[name];
    if (el && el.type === "password" && !el.disabled) el.value = value;
  }
}

async function openConfig() {
  try {
    const {data, ok} = await request("/api/settings");
    if (!ok) throw new Error();
    settings = data;
    clearing.clear(); tests = {};
    put($("config"));
    renderConfig();
  } catch (e) {
    if (e !== LOGIN) toast("Could not load the settings");
  }
}

function show(name) {
  view = name;
  $("view-updates").hidden = name !== "updates";
  $("view-log").hidden = name !== "log";
  $("view-config").hidden = name !== "config";
  if (name === "config") openConfig();
  if (name === "log") { renderLogTools(); renderLog(); loadLog(); }
  render();
}

$("config").addEventListener("submit", async e => {
  e.preventDefault();
  const values = typed();
  $("save").disabled = true; $("save").textContent = "Saving and testing…";
  try {
    const {data} = await request("/api/settings", {values, clear: [...clearing]});
    if (!data.ok) { toast(data.error || "Saving failed"); return; }
    settings = {values: data.values, secrets: data.secrets};
    clearing.clear();
    put($("config"));
    renderConfig();
    const order = ["config", "slm", "prowlarr", "downloader"];
    put($("results"), ...order.filter(n => data.services[n]).map(n =>
      h("div", {class: data.services[n].ok ? "" : "bad"}, (data.services[n].ok ? "✓ " : "✕ ") + SERVICES[n] + ": " + data.services[n].text)));
    toast("Settings saved");
    load();
  } catch (err) {
    if (err !== LOGIN) toast("No connection to NSWHunter");
  } finally {
    if ($("save")) { $("save").disabled = false; $("save").textContent = "Save and test the connections"; }
  }
});

async function load() {
  if (auth) return;  // the login screen is up: nothing to fetch until it is passed
  try {
    const {data, ok} = await request("/api/state");
    if (!ok) throw new Error();
    state = data;
    $("app").hidden = false;
    // First visit without settings: go straight to where they are filled in.
    if (!opened) { opened = true; if (!state.configured) { show("config"); return; } show(view); return; }
    // Keep typing in the filter box and keep the sort list open: only rebuild around them.
    if (["filter", "sort"].includes(document.activeElement && document.activeElement.id)) renderList(); else render();
    if (view === "log") loadLog();
  } catch (e) {
    if (e !== LOGIN) { $("app").hidden = false; $("statusline").textContent = "No connection to NSWHunter"; }
  }
}
$("sync").addEventListener("click", async () => {
  try {
    await request("/api/sync", {});
    toast("Round started"); setTimeout(load, 1500);
  } catch (e) {
    if (e !== LOGIN) toast("No connection to NSWHunter");
  }
});
load();
setInterval(load, 8000);
</script>
</body>
</html>
