services:
  nswhunter:
    container_name: nswhunter
    image: ghcr.io/terrorsource/nswhunter:latest
    restart: always
    network_mode: bridge
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    environment:
      - TZ=Etc/UTC
    ports:
      - 3033:3033
    volumes:
      - /path/to/nswhunter/data:/data
      - /path/to/nswhunter/backup:/backup
